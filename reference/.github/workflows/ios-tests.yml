          IOS_CI_PACKAGE_RESOLVED: '${{ github.workspace }}/ios/example-ios.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
        run: bash scripts/manage-ios-build-cache.sh prepare "$IOS_CI_CACHE_LANE"
      - name: Rebuild E2E test products for consumer Xcode
        if: steps.prepare-e2e-products.outputs.rebuild_required == 'true'
        env:
          IOS_E2E_TEST_PLAN: CI-E2E
          IOS_E2E_DERIVED_DATA: '${{ env.IOS_CI_DERIVED_DATA }}'
          IOS_SOURCE_PACKAGES_DIR: '${{ env.IOS_CI_SOURCE_PACKAGES }}'
        run: bash scripts/build-ios-e2e-test-products.sh
      - name: Export exact-toolchain E2E launch paths
        env:
          IOS_E2E_TEST_PRODUCTS: '${{ env.IOS_E2E_TEST_PRODUCTS }}'
        run: node ci/src/actions/ios/exportE2eLaunchPaths.ts
      - name: Prepare onboarding result paths
        id: onboarding-paths
        env:
          E2E_LANE: '${{ env.E2E_LANE }}'
        run: node ci/src/actions/ios/prepareRealServerE2ePaths.ts
      - name: Compute exact-head debt-card build key
        id: debt-card-build-key
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'debt-card-evidence'
        env:
          EXACT_HEAD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
        run: node ci/src/actions/ios/computeDebtCardBuildKey.ts
      - name: Restore exact-head debt-card test products
        id: restore-debt-card-test-products
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'debt-card-evidence'
        with:
          path: '${{ steps.onboarding-paths.outputs.debt_card_cache_dir }}'
          key: '${{ steps.debt-card-build-key.outputs.cache_key }}'
      - name: Validate exact-head debt-card test products
        id: validate-debt-card-test-products
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'debt-card-evidence'
        env:
          BUILD_FINGERPRINT: '${{ steps.debt-card-build-key.outputs.build_fingerprint }}'
          CACHE_HIT: '${{ steps.restore-debt-card-test-products.outputs.cache-hit }}'
          EXACT_HEAD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          MANIFEST_PATH: '${{ steps.onboarding-paths.outputs.debt_card_cache_manifest }}'
          TEST_PRODUCTS_PATH: '${{ steps.onboarding-paths.outputs.debt_card_test_products }}'
        run: node ci/src/actions/ios/validateDebtCardTestProducts.ts
      - name: Build exact-head debt-card test products
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'debt-card-evidence' && steps.validate-debt-card-test-products.outputs.usable != 'true'
        env:
          BUILD_FINGERPRINT: '${{ steps.debt-card-build-key.outputs.build_fingerprint }}'
          CACHE_DIR: '${{ steps.onboarding-paths.outputs.debt_card_cache_dir }}'
          EXACT_HEAD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          MANIFEST_PATH: '${{ steps.onboarding-paths.outputs.debt_card_cache_manifest }}'
          TEST_PRODUCTS_PATH: '${{ steps.onboarding-paths.outputs.debt_card_test_products }}'
          ONBOARDING_E2E_RUN_DIR: '${{ env.ONBOARDING_E2E_RUN_DIR }}'
        run: node ci/src/actions/ios/buildDebtCardTestProducts.ts
      - name: Save exact-head debt-card test products
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'debt-card-evidence' && steps.validate-debt-card-test-products.outputs.usable != 'true'
        with:
          path: '${{ steps.onboarding-paths.outputs.debt_card_cache_dir }}'
          key: '${{ steps.debt-card-build-key.outputs.cache_key }}'
      - name: Isolate Google Cloud SDK state
        run: node .ci/trusted-ios-revision-guard/ci/src/actions/ios/isolateCloudSdkState.ts
      - name: Configure Cloud SDK Python
        run: node ci/src/actions/ios/configureCloudSdkPython.ts
      - name: Authenticate dev E2E backend to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: example-app
          workload_identity_provider: projects/123456789012/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-ci@example-app.iam.gserviceaccount.com
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 390.0.0'
          cache: true
      - name: Load dev GCP runtime config
        run: node ci/src/actions/ios/loadDevGcpRuntimeConfig.ts
      - name: Verify deployed development database schema
        timeout-minutes: 10
        run: 'npm run db:verify-plaid-scheduler'
      - name: Allocate lane-isolated dev backend port
        env:
          E2E_LANE: '${{ env.E2E_LANE }}'
        run: node ci/src/actions/ios/allocateLaneBackendPort.ts
      - name: Ensure lane-isolated dev backend (NODE_ENV=development)
        env:
          E2E_LANE: '${{ env.E2E_LANE }}'
          ONBOARDING_DEV_BACKEND_PORT: '${{ env.ONBOARDING_DEV_BACKEND_PORT }}'
          ONBOARDING_DEV_BACKEND_LOG: '${{ env.ONBOARDING_DEV_BACKEND_LOG }}'
          ONBOARDING_DEV_BACKEND_SUPERVISOR_LOG: '${{ env.ONBOARDING_DEV_BACKEND_SUPERVISOR_LOG }}'
          ONBOARDING_DEV_BACKEND_PID_FILE: '${{ env.ONBOARDING_DEV_BACKEND_PID_FILE }}'
          ONBOARDING_E2E_COMMIT_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          INCOME_E2E_PROVIDER_AUDIT_LOG: '${{ env.INCOME_E2E_PROVIDER_AUDIT_LOG }}'
          SERVER_DEV_DOTENV_B64: '${{ secrets.SERVER_DEV_DOTENV_B64 }}'
        timeout-minutes: 15
        run: node ci/src/actions/ios/ensureLaneDevBackend.ts
      - name: Prepare fresh Chat Plaid E2E user
        if: env.E2E_LANE == 'chat-plaid' && success()
        env:
          ONBOARDING_DEV_BACKEND_PORT: '${{ env.ONBOARDING_DEV_BACKEND_PORT }}'
        run: node ci/src/actions/ios/prepareChatPlaidE2eUser.ts
      - name: Reset CoreSimulator host
        timeout-minutes: 2
        run: bash "$GITHUB_WORKSPACE/scripts/ensure-ios-simulator-host.sh"
      - name: Select iOS Simulator
        id: sim
        env:
          TEST_SCOPE: '${{ inputs.test_scope || '''' }}'
        run: node ci/src/actions/ios/selectE2eSimulator.ts
      - name: Ensure video review tooling
        if: env.E2E_LANE == 'onboarding' && needs.ios-change-gate.outputs.onboarding_required == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'))
        continue-on-error: true
        run: node ci/src/actions/ios/ensureVideoReviewTooling.ts
      - name: Provision development FullOnboarding users
        id: provision-development-full-onboarding-users
        if: env.E2E_LANE == 'onboarding' && needs.ios-change-gate.outputs.onboarding_required == 'true'
        env:
          ONBOARDING_DEV_BACKEND_PORT: '${{ env.ONBOARDING_DEV_BACKEND_PORT }}'
        continue-on-error: true
        run: node ci/src/actions/ios/provisionDevelopmentOnboardingUsers.ts
      - name: Start Dashboard offline E2E proxy
        id: start-dashboard-offline-proxy
        if: env.E2E_LANE == 'onboarding' && needs.ios-change-gate.outputs.onboarding_required == 'true' && steps.provision-development-full-onboarding-users.outcome == 'success'
        env:
          ONBOARDING_DEV_BACKEND_PORT: '${{ env.ONBOARDING_DEV_BACKEND_PORT }}'
          ONBOARDING_E2E_COMMIT_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          DASHBOARD_OFFLINE_PROXY_EVENTS: '${{ env.DASHBOARD_OFFLINE_PROXY_EVENTS }}'
          DASHBOARD_OFFLINE_PROXY_LOG: '${{ env.DASHBOARD_OFFLINE_PROXY_LOG }}'
        timeout-minutes: 5
        run: node ci/src/actions/ios/startDashboardOfflineProxy.ts
      - name: Run onboarding E2E
        id: onboarding-e2e
        if: env.E2E_LANE == 'onboarding' && needs.ios-change-gate.outputs.onboarding_required == 'true' && steps.provision-development-full-onboarding-users.outcome == 'success' && steps.start-dashboard-offline-proxy.outcome == 'success'
        env:
          DASHBOARD_OFFLINE_PROXY_PORT: '${{ env.DASHBOARD_OFFLINE_PROXY_PORT }}'
          ONBOARDING_E2E_RUN_DIR: '${{ env.ONBOARDING_E2E_RUN_DIR }}'
          DESTINATION: '${{ steps.sim.outputs.dest }}'
          ONBOARDING_ALLOW_STOREKIT_RUNTIME_FALLBACK: '${{ steps.sim.outputs.storekit_runtime_fallback }}'
          ITERATIONS: '1'
          RESULT_BUNDLE: '${{ env.ONBOARDING_E2E_RESULT_BUNDLE }}'
          XCODEBUILD_LOG: '${{ env.ONBOARDING_E2E_XCODEBUILD_LOG }}'
          DERIVED_DATA: '${{ env.IOS_CI_DERIVED_DATA }}'
          SOURCE_PACKAGES: '${{ env.IOS_CI_SOURCE_PACKAGES }}'
          PACKAGE_CACHE: '${{ env.IOS_CI_PACKAGE_CACHE }}'
          RECORD_VIDEO: '${{ (((github.event_name == ''pull_request'' && github.event.pull_request.base.ref == ''main'')) || (github.event_name == ''workflow_dispatch'' && github.ref == ''refs/heads/main'')) && ''1'' || ''0'' }}'
          RAW_VIDEO: '${{ env.ONBOARDING_E2E_RAW_VIDEO }}'
          COMPRESSED_VIDEO: '${{ env.ONBOARDING_E2E_COMPRESSED_VIDEO }}'
          UI_TEST_PRODUCTION_E2E: '0'
          UI_TEST_SYNTHETIC_ONBOARDING_EMAIL: '${{ env.UI_TEST_SYNTHETIC_ONBOARDING_EMAIL }}'
          UI_TEST_SYNTHETIC_PRIVACY_EMAIL: '${{ env.UI_TEST_SYNTHETIC_PRIVACY_EMAIL }}'
          UI_TEST_SYNTHETIC_PASSWORD: '${{ env.UI_TEST_SYNTHETIC_PASSWORD }}'
          UI_TEST_DASHBOARD_OFFLINE_E2E: '1'
          UI_TEST_EXPECTED_SERVER_BUILD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          DASHBOARD_OFFLINE_PROXY_CONTROL_TOKEN: '${{ env.DASHBOARD_OFFLINE_PROXY_CONTROL_TOKEN }}'
        run: node ci/src/actions/ios/runOnboardingE2e.ts
      - name: Stop Dashboard offline E2E proxy
        id: stop-dashboard-offline-proxy
        if: env.E2E_LANE == 'onboarding' && always() && env.DASHBOARD_OFFLINE_PROXY_PID != ''
        env:
          SUPERVISED_PROXY: dashboard-offline
          DASHBOARD_OFFLINE_PROXY_PID: '${{ env.DASHBOARD_OFFLINE_PROXY_PID }}'
          DASHBOARD_OFFLINE_PROXY_LOG: '${{ env.DASHBOARD_OFFLINE_PROXY_LOG }}'
        run: node ci/src/actions/ios/stopSupervisedProxy.ts
      - name: Delete development FullOnboarding users
        id: delete-development-full-onboarding-users
        if: env.E2E_LANE == 'onboarding' && always() && steps.provision-development-full-onboarding-users.outputs.cleanup_required == 'true'
        env:
          DEVELOPMENT_FULL_ONBOARDING_CLEANUP_EVIDENCE: '${{ env.DEVELOPMENT_FULL_ONBOARDING_CLEANUP_EVIDENCE }}'
          ONBOARDING_DEV_BACKEND_PORT: '${{ env.ONBOARDING_DEV_BACKEND_PORT }}'
          ONBOARDING_E2E_COMMIT_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          UI_TEST_SYNTHETIC_ONBOARDING_EMAIL: '${{ env.UI_TEST_SYNTHETIC_ONBOARDING_EMAIL }}'
          UI_TEST_SYNTHETIC_PRIVACY_EMAIL: '${{ env.UI_TEST_SYNTHETIC_PRIVACY_EMAIL }}'
          UI_TEST_SYNTHETIC_PASSWORD: '${{ env.UI_TEST_SYNTHETIC_PASSWORD }}'
        continue-on-error: true
        run: node ci/src/actions/ios/deleteDevelopmentFullOnboardingUsers.ts
      - name: Validate development FullOnboarding evidence
        id: validate-onboarding-lifecycle
        if: env.E2E_LANE == 'onboarding' && always() && needs.ios-change-gate.outputs.onboarding_required == 'true'
        env:
          PROVISION_OUTCOME: '${{ steps.provision-development-full-onboarding-users.outcome }}'
          PROXY_START_OUTCOME: '${{ steps.start-dashboard-offline-proxy.outcome }}'
          ONBOARDING_OUTCOME: '${{ steps.onboarding-e2e.outcome }}'
          PROXY_STOP_OUTCOME: '${{ steps.stop-dashboard-offline-proxy.outcome }}'
          CLEANUP_OUTCOME: '${{ steps.delete-development-full-onboarding-users.outcome }}'
          DASHBOARD_OFFLINE_PROXY_EVENTS: '${{ env.DASHBOARD_OFFLINE_PROXY_EVENTS }}'
          DEVELOPMENT_FULL_ONBOARDING_CLEANUP_EVIDENCE: '${{ env.DEVELOPMENT_FULL_ONBOARDING_CLEANUP_EVIDENCE }}'
          ONBOARDING_E2E_XCODEBUILD_LOG: '${{ env.ONBOARDING_E2E_XCODEBUILD_LOG }}'
          ONBOARDING_E2E_RESULT_BUNDLE: '${{ env.ONBOARDING_E2E_RESULT_BUNDLE }}'
          ONBOARDING_E2E_COMMIT_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          DASHBOARD_OFFLINE_EVIDENCE_JSON: '${{ env.DASHBOARD_OFFLINE_EVIDENCE_JSON }}'
        run: node ci/src/actions/ios/validateOnboardingLifecycle.ts
      - name: Start Income E2E Cloud SQL proxy
        if: env.E2E_LANE == 'income' && success()
        env:
          INCOME_E2E_RUN_DIR: '${{ env.INCOME_E2E_RUN_DIR }}'
          INCOME_E2E_DB_PROXY_LOG: '${{ env.INCOME_E2E_DB_PROXY_LOG }}'
        timeout-minutes: 5
        run: node ci/src/actions/ios/startIncomeCloudSqlProxy.ts
      - name: Run Income activation E2E
        id: income-e2e
        if: env.E2E_LANE == 'income' && success()
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '${{ env.INCOME_E2E_DB_PROXY_PORT }}'
          DB_USER: github-actions-ci@example-app.iam
          DB_NAME: example
          DESTINATION: '${{ steps.sim.outputs.dest }}'
          UI_TEST_API_BASE_URL: '${{ env.TEST_RUNNER_UI_TEST_API_BASE_URL }}'
          INCOME_E2E_SERVER_LOG: '${{ env.ONBOARDING_DEV_BACKEND_LOG }}'
          INCOME_E2E_PROVIDER_AUDIT_LOG: '${{ env.INCOME_E2E_PROVIDER_AUDIT_LOG }}'
          SKIP_BUILD: '1'
          XCTESTRUN_PATH: '${{ env.XCTESTRUN_PATH }}'
          RESULT_BUNDLE: '${{ env.INCOME_E2E_RESULT_BUNDLE }}'
          XCODEBUILD_LOG: '${{ env.INCOME_E2E_XCODEBUILD_LOG }}'
          RAW_VIDEO: '${{ env.INCOME_E2E_RAW_VIDEO }}'
          VIDEO_OUTPUT: '${{ env.INCOME_E2E_COMPRESSED_VIDEO }}'
        run: bash scripts/ios-test-income-e2e.sh
      - name: Stop Income E2E Cloud SQL proxy
        if: env.E2E_LANE == 'income' && always() && env.INCOME_E2E_DB_PROXY_PID != ''
        env:
          SUPERVISED_PROXY: income-cloud-sql
          INCOME_E2E_DB_PROXY_PID: '${{ env.INCOME_E2E_DB_PROXY_PID }}'
          INCOME_E2E_DB_PROXY_LOG: '${{ env.INCOME_E2E_DB_PROXY_LOG }}'
        run: node ci/src/actions/ios/stopSupervisedProxy.ts
      - name: Run Chat Plaid E2E
        id: chat-plaid-e2e
        if: env.E2E_LANE == 'chat-plaid' && success()
        env:
          TEST_RUNNER_UI_TEST_API_BASE_URL: '${{ env.TEST_RUNNER_UI_TEST_API_BASE_URL }}'
          TEST_RUNNER_UI_TEST_EMAIL: '${{ env.CHAT_PLAID_E2E_EMAIL }}'
          TEST_RUNNER_UI_TEST_PASSWORD: '${{ env.CHAT_PLAID_E2E_PASSWORD }}'
          DESTINATION: '${{ steps.sim.outputs.dest }}'
          XCTESTRUN_PATH: '${{ env.XCTESTRUN_PATH }}'
          ONBOARDING_E2E_RUN_DIR: '${{ env.ONBOARDING_E2E_RUN_DIR }}'
          CHAT_PLAID_E2E_RESULT_BUNDLE: '${{ env.CHAT_PLAID_E2E_RESULT_BUNDLE }}'
          CHAT_PLAID_E2E_XCODEBUILD_LOG: '${{ env.CHAT_PLAID_E2E_XCODEBUILD_LOG }}'
        run: node ci/src/actions/ios/runChatPlaidE2e.ts
      - name: Validate Chat Plaid backend evidence
        id: validate-chat-plaid-evidence
        if: env.E2E_LANE == 'chat-plaid' && !cancelled() && steps.chat-plaid-e2e.outcome == 'success'
        env:
          CHAT_PLAID_E2E_EVIDENCE_DIR: '${{ env.CHAT_PLAID_E2E_EVIDENCE_DIR }}'
          ONBOARDING_DEV_BACKEND_LOG: '${{ env.ONBOARDING_DEV_BACKEND_LOG }}'
        run: node ci/src/actions/ios/validateChatPlaidEvidence.ts
      - name: Delete Chat Plaid E2E user
        if: env.E2E_LANE == 'chat-plaid' && always()
        env:
          ONBOARDING_DEV_BACKEND_PORT: '${{ env.ONBOARDING_DEV_BACKEND_PORT }}'
          CHAT_PLAID_E2E_EMAIL: '${{ env.CHAT_PLAID_E2E_EMAIL }}'
        run: node ci/src/actions/ios/deleteChatPlaidE2eUser.ts
      - name: Run Budget real-server E2E
        id: budget-e2e
        if: env.E2E_LANE == 'budget' && success() && needs.ios-change-gate.outputs.budget_required == 'true' && inputs.test_scope != 'debt-card-evidence'
        env:
          DESTINATION: '${{ steps.sim.outputs.dest }}'
          IOS_SIMULATOR_DESTINATION: '${{ steps.sim.outputs.dest }}'
          BUDGET_E2E_RUN_DIR: '${{ env.ONBOARDING_E2E_RUN_DIR }}'
          RESULT_BUNDLE: '${{ env.BUDGET_E2E_RESULT_BUNDLE }}'
          XCODEBUILD_LOG: '${{ env.BUDGET_E2E_XCODEBUILD_LOG }}'
          DERIVED_DATA: '${{ env.IOS_CI_DERIVED_DATA }}'
          SOURCE_PACKAGES: '${{ env.IOS_CI_SOURCE_PACKAGES }}'
          PACKAGE_CACHE: '${{ env.IOS_CI_PACKAGE_CACHE }}'
          SKIP_BUILD: '1'
          RECORD_VIDEO: '${{ (((github.event_name == ''pull_request'' && github.event.pull_request.base.ref == ''main'')) || (github.event_name == ''workflow_dispatch'' && github.ref == ''refs/heads/main'')) && ''1'' || ''0'' }}'
          RAW_VIDEO: '${{ env.BUDGET_E2E_RAW_VIDEO }}'
          COMPRESSED_VIDEO: '${{ env.BUDGET_E2E_COMPRESSED_VIDEO }}'
          VIDEO_LOG: '${{ env.BUDGET_E2E_VIDEO_LOG }}'
          BUDGET_E2E_CLEANUP_RECEIPT: '${{ env.IOS_3996_CLEANUP_RECEIPT }}'
          UI_TEST_API_BASE_URL: '${{ env.TEST_RUNNER_UI_TEST_API_BASE_URL }}'
          UI_TEST_EMAIL: 'budget-e2e-${{ github.run_id }}-${{ github.run_attempt }}@test.example.local'
          EXPECTED_SERVER_BUILD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
        run: bash scripts/run-ios-budget-e2e-shards.sh
      - name: Run Issue 3998 real-backend debt freshness evidence
        id: debt-card-backend-evidence
        if: env.E2E_LANE == 'budget' && always() && !cancelled() && inputs.test_scope == 'debt-card-evidence'
        env:
          DESTINATION: '${{ steps.sim.outputs.dest }}'
          BUDGET_E2E_RUN_DIR: '${{ env.ONBOARDING_E2E_RUN_DIR }}'
          BUDGET_E2E_TEST_PLAN: Debt-Card-Backend-Evidence
          BUDGET_E2E_EXPECTED_TEST_COUNT: '1'
          BUDGET_E2E_EVIDENCE_ISSUE: '3998'
          BUDGET_E2E_FRESHNESS_RECEIPT: '${{ env.IOS_3998_FRESHNESS_RECEIPT }}'
          BUDGET_E2E_CLEANUP_RECEIPT: '${{ env.IOS_3998_CLEANUP_RECEIPT }}'
          RESULT_BUNDLE: '${{ env.BUDGET_E2E_RESULT_BUNDLE }}'
          XCODEBUILD_LOG: '${{ env.BUDGET_E2E_XCODEBUILD_LOG }}'
          TEST_PRODUCTS: '${{ env.DEBT_CARD_TEST_PRODUCTS }}'
          SKIP_BUILD: '1'
          SIMULATOR_BOOT_TIMEOUT_SECONDS: '180'
          RECORD_VIDEO: '${{ ((github.event_name == ''pull_request'' && github.event.pull_request.base.ref == ''main'')) && ''1'' || ''0'' }}'
          RAW_VIDEO: '${{ env.BUDGET_E2E_RAW_VIDEO }}'
          COMPRESSED_VIDEO: '${{ env.BUDGET_E2E_COMPRESSED_VIDEO }}'
          VIDEO_LOG: '${{ env.BUDGET_E2E_VIDEO_LOG }}'
          UI_TEST_API_BASE_URL: '${{ env.TEST_RUNNER_UI_TEST_API_BASE_URL }}'
          EXPECTED_SERVER_BUILD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          GH_TOKEN: '${{ github.token }}'
        run: bash scripts/ios-test-budget-e2e.sh
      - name: Remove local debt-card test products
        if: env.E2E_LANE == 'budget' && always() && inputs.test_scope == 'debt-card-evidence'
        env:
          CACHE_DIR: '${{ steps.onboarding-paths.outputs.debt_card_cache_dir }}'
        run: node ci/src/actions/ios/removeDebtCardTestProducts.ts
      - name: Verify Issue 3999 Release archive boundary
        id: debt-card-release-archive
        if: env.E2E_LANE == 'budget' && always() && !cancelled() && inputs.test_scope == 'debt-card-evidence'
        env:
          CARD_REWARDS_ARCHIVE_RUN_DIR: '${{ env.ONBOARDING_E2E_RUN_DIR }}/release-archive'
          CARD_REWARDS_ARCHIVE_EVIDENCE: '${{ env.IOS_3999_ARCHIVE_EVIDENCE }}'
          DERIVED_DATA: '${{ env.ONBOARDING_E2E_RUN_DIR }}/ArchiveDerivedData'
          SOURCE_PACKAGES: '${{ env.ONBOARDING_E2E_RUN_DIR }}/SourcePackages'
          PACKAGE_CACHE: '${{ env.ONBOARDING_E2E_RUN_DIR }}/PackageCache'
          EXPECTED_HEAD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
        timeout-minutes: 25
        run: bash scripts/verify-card-rewards-release-archive.sh
      - name: Retain Issue 3998 freshness evidence
        if: env.E2E_LANE == 'budget' && always() && !cancelled() && inputs.test_scope == 'debt-card-evidence' && steps.debt-card-backend-evidence.outcome == 'success'
        env:
          IOS_EVIDENCE_RETENTION: issue-3998-freshness
          IOS_3998_FRESHNESS_RECEIPT: '${{ env.IOS_3998_FRESHNESS_RECEIPT }}'
          IOS_3998_CLEANUP_RECEIPT: '${{ env.IOS_3998_CLEANUP_RECEIPT }}'
          BUDGET_E2E_XCODEBUILD_LOG: '${{ env.BUDGET_E2E_XCODEBUILD_LOG }}'
          BUDGET_E2E_RESULT_BUNDLE: '${{ env.BUDGET_E2E_RESULT_BUNDLE }}'
        run: node ci/src/actions/ios/retainIosE2eEvidence.ts
      - name: Retain Issue 3999 Release archive evidence
        if: env.E2E_LANE == 'budget' && always() && !cancelled() && inputs.test_scope == 'debt-card-evidence' && steps.debt-card-release-archive.outcome == 'success'
        env:
          IOS_EVIDENCE_RETENTION: issue-3999-release-archive
          IOS_3999_ARCHIVE_EVIDENCE: '${{ env.IOS_3999_ARCHIVE_EVIDENCE }}'
        run: node ci/src/actions/ios/retainIosE2eEvidence.ts
      - name: Validate Issue 3996 automated debt-history acceptance
