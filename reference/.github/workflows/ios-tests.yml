        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.ios-change-gate.outputs.reuse_e2e_products == 'true' && steps.restore-reused-e2e-test-products.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: .example-ci/handoff/example-ios-e2e.xctestproducts.zip
          key: 'ios-e2e-test-products-v2-${{ needs.ios-change-gate.outputs.reused_e2e_head_sha }}-${{ needs.ios-change-gate.outputs.reused_e2e_run_id }}-${{ needs.ios-change-gate.outputs.reused_e2e_run_attempt }}'
      - name: Bind content-identical E2E products to this exact head
        id: rebind-reused-e2e-test-products
