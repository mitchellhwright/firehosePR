        env:
          EXACT_HEAD_SHA: '${{ github.sha }}'
          IOS_EVIDENCE_VALIDATION: financial-independence
        run: node ../ci/src/actions/ios/validateIosEvidence.ts
      - name: Validate Issue 4549 onboarding-copy accessibility evidence
        id: validate-onboarding-copy
        if: 'always() && startsWith(matrix.lane, ''evidence-'') && steps.affected-tests.outputs.should_run == ''true'' && (contains(steps.evidence-shard.outputs.evidence_groups, ''accessibility'') || contains(steps.evidence-shard.outputs.evidence_groups, ''onboarding-copy''))'
        env:
          EXACT_HEAD_SHA: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
          IOS_EVIDENCE_VALIDATION: onboarding-copy
        run: node ../ci/src/actions/ios/validateIosEvidence.ts
      - name: Retain required Wellness execution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.lane == 'native1' && steps.affected-tests.outputs.wellness_required == 'true' && steps.affected-tests.outputs.should_run == 'true' && steps.execute-tests.outcome == 'failure'
        continue-on-error: true
        with:
          name: 'wellness-native-${{ github.run_id }}-${{ github.run_attempt }}'
          retention-days: 3
          if-no-files-found: error
          path: '${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/wellness-contract.*'
      - name: Upload iOS Test Screenshots
        id: upload-ios-test-screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: 'always() && steps.affected-tests.outputs.should_run == ''true'' && ((matrix.lane == ''native1'' && github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''financial-independence-evidence'') || startsWith(matrix.lane, ''evidence-'')) && (steps.execute-tests.outcome == ''failure'' || steps.summarize-ios-test-failures.outcome == ''failure'' || steps.validate-financial-independence.outcome == ''failure'' || steps.validate-onboarding-copy.outcome == ''failure'' || steps.export-ios-test-screenshots.outcome == ''failure'')'
        continue-on-error: true
        with:
          name: 'ios-test-${{ matrix.lane }}-screenshots-${{ github.run_id }}-${{ github.run_attempt }}'
          retention-days: 3
          path: '${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/screenshots'
