        run: node ci/src/actions/ios/retainIosE2eEvidence.ts
      - name: Upload Budget E2E diagnostics
        id: upload-budget-e2e-diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.E2E_LANE == 'budget' && always() && (steps.budget-e2e.outcome == 'failure' || failure() || steps.validate-ios-3996-evidence.outcome == 'failure' || steps.export-compact-summaries.outcome == 'failure' || (steps.budget-e2e.outcome == 'skipped' && failure()))
        continue-on-error: true
        with:
          name: 'budget-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}${{ env.BUDGET_E2E_ARTIFACT_SUFFIX }}'
          compression-level: 0
          retention-days: 1
          path: |
            ${{ env.BUDGET_E2E_RESULT_BUNDLE }}
            ${{ env.BUDGET_E2E_XCODEBUILD_LOG }}
            ${{ env.ONBOARDING_E2E_RUN_DIR }}/shards
            ${{ env.BACKEND_DIAGNOSTICS_DIR }}/devserver.log
            ${{ env.BACKEND_DIAGNOSTICS_DIR }}/devserver-supervisor.log
            ${{ env.BUDGET_E2E_RAW_VIDEO }}
            ${{ env.BUDGET_E2E_VIDEO_LOG }}
            ${{ env.IOS_3996_EVIDENCE_DIR }}
            ${{ env.IOS_3996_CLEANUP_RECEIPT }}
          if-no-files-found: ignore
      - name: Retain Budget E2E diagnostics on runner
        if: env.E2E_LANE == 'budget' && always() && steps.upload-budget-e2e-diagnostics.outcome == 'failure'
        env:
          IOS_EVIDENCE_RETENTION: budget-diagnostics
          BUDGET_E2E_RESULT_BUNDLE: '${{ env.BUDGET_E2E_RESULT_BUNDLE }}'
          BUDGET_E2E_XCODEBUILD_LOG: '${{ env.BUDGET_E2E_XCODEBUILD_LOG }}'
          ONBOARDING_E2E_RUN_DIR: '${{ env.ONBOARDING_E2E_RUN_DIR }}'
          BACKEND_DIAGNOSTICS_DIR: '${{ env.BACKEND_DIAGNOSTICS_DIR }}'
          BUDGET_E2E_RAW_VIDEO: '${{ env.BUDGET_E2E_RAW_VIDEO }}'
          BUDGET_E2E_VIDEO_LOG: '${{ env.BUDGET_E2E_VIDEO_LOG }}'
          IOS_3996_EVIDENCE_DIR: '${{ env.IOS_3996_EVIDENCE_DIR }}'
          IOS_3996_CLEANUP_RECEIPT: '${{ env.IOS_3996_CLEANUP_RECEIPT }}'
        run: node ci/src/actions/ios/retainIosE2eEvidence.ts
