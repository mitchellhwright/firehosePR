  income-e2e:
    name: Real-server E2E execution (income)
    needs:
      - ios-change-gate
      - confirm-current-ios-pr
      - build-ios-e2e-test-products
      - prepare-dev-e2e-schema
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.confirm-current-ios-pr.outputs.current == 'true') && needs.build-ios-e2e-test-products.result == 'success' && needs.prepare-dev-e2e-schema.result == 'success' && needs.ios-change-gate.outputs.should_run == 'true' && needs.ios-change-gate.outputs.income_required == 'true' && ((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.base.ref == 'develop' || github.event.pull_request.base.ref == 'main')) || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/develop'))) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && inputs.test_scope != 'mortgage-assignment-evidence' && inputs.test_scope != 'debt-card-evidence'))
    runs-on:
      group: '${{ ((github.event_name == ''pull_request'' || github.event_name == ''merge_group'') || (github.event_name == ''workflow_dispatch'' && inputs.mac_runner == ''mitchell-reserved'') || (github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''promotion-evidence'')) && ''example-reviewed-pr-macs'' || ''example-team-macs'' }}'
      labels: '${{ fromJson((github.event_name == ''workflow_dispatch'' && inputs.mac_runner == ''mitchell-reserved'') && ''["self-hosted","macOS","ios-reserved-mitchell"]'' || ''["self-hosted","macOS","ios-xcode"]'') }}'
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    environment:
      name: development-e2e
    concurrency:
      group: 'ios-${{ fromJSON((github.event_name == ''pull_request'' && toJSON(format(''pr-{0}'', github.event.pull_request.number))) || (github.event_name == ''merge_group'' && toJSON(format(''mq-{0}'', github.event.merge_group.head_ref))) || (github.event_name == ''workflow_dispatch'' && toJSON(format(''event-{0}'', github.run_id))) || toJSON(format(''event-{0}'', github.run_id))) }}-income'
      cancel-in-progress: '${{ github.event_name == ''pull_request'' && github.event.action == ''synchronize'' }}'
    env:
      E2E_LANE: income
      ONBOARDING_DEV_BACKEND_PORT: '3300'
      ONBOARDING_E2E_COMMIT_SHA: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
      TEST_RUNNER_UI_TEST_API_BASE_URL: 'http://127.0.0.1:3300/api'
      VERIFY_APPLE_AUTHORIZATION_SCHEMA: 'false'
    steps:
      - name: Export simulator runner environment
        shell: bash
        working-directory: '${{ runner.temp }}'
        env:
          SIMULATOR_RUNNER_ENVIRONMENT: '${{ runner.environment }}'
        run: printf 'RUNNER_ENVIRONMENT=%s\n' "$SIMULATOR_RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - name: Reset oversized dedicated-runner checkout
        if: runner.name == 'Mitchells-MacBook-Air-ios-24gb' || runner.name == 'Mitchells-MacBook-Air-control-capacity'
