          RECORD_VIDEO: '${{ (((github.event_name == ''pull_request'' && github.event.pull_request.base.ref == ''main'')) || (github.event_name == ''workflow_dispatch'' && github.ref == ''refs/heads/main'')) && ''1'' || ''0'' }}'
          RAW_VIDEO: '${{ env.BUDGET_E2E_RAW_VIDEO }}'
          COMPRESSED_VIDEO: '${{ env.BUDGET_E2E_COMPRESSED_VIDEO }}'
          VIDEO_LOG: '${{ env.BUDGET_E2E_VIDEO_LOG }}'
