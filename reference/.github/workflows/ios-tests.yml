          IOS_RUNNER_RECLAIM_SECONDARY_LEGACY_SIMULATOR_UDID: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''44ae288e-5329-5a9a-8522-4af2c9d5c4b5'' || '''' }}'
          IOS_RUNNER_RECLAIM_ADDITIONAL_LEGACY_SIMULATORS_JSON: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''[{"name":"iPhone 17 Pro","runtime":"com.apple.CoreSimulator.SimRuntime.iOS-26-0","udid":"f39f2a52-cbe6-5719-86ee-3f9ce3a7d81d"},{"name":"iPhone 17","runtime":"com.apple.CoreSimulator.SimRuntime.iOS-26-0","udid":"b16072c6-7af0-5703-9dec-72596d4cddd6"},{"name":"iPhone 17 Pro","runtime":"com.apple.CoreSimulator.SimRuntime.iOS-26-3","udid":"c4223962-45e0-5b77-aa31-058e756cfa1f"},{"name":"iPhone 16e","runtime":"com.apple.CoreSimulator.SimRuntime.iOS-26-3","udid":"69cc431a-5d70-54d7-904b-00f9a675d9ed"},{"name":"iPhone 17 Pro Max","runtime":"com.apple.CoreSimulator.SimRuntime.iOS-26-0","udid":"d997d72b-cce5-5bfd-808b-284c578dfcfa"}]'' || ''[]'' }}'
        timeout-minutes: 10
