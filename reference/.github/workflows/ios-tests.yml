      - name: Prepare shared E2E build cache
        if: needs.ios-change-gate.outputs.reuse_e2e_products != 'true' || (steps.restore-reused-e2e-test-products.outputs.cache-hit != 'true' && steps.restore-legacy-reused-e2e-test-products.outputs.cache-hit != 'true') || steps.rebind-reused-e2e-test-products.outputs.rebuild_required == 'true'
        env:
          IOS_CI_CACHE_LANE: e2e-shared
          IOS_CI_PACKAGE_RESOLVED: '${{ github.workspace }}/ios/example-ios.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
        run: bash scripts/manage-ios-build-cache.sh prepare "$IOS_CI_CACHE_LANE"
      - name: Build exact-head E2E products once
        if: needs.ios-change-gate.outputs.reuse_e2e_products != 'true' || (steps.restore-reused-e2e-test-products.outputs.cache-hit != 'true' && steps.restore-legacy-reused-e2e-test-products.outputs.cache-hit != 'true') || steps.rebind-reused-e2e-test-products.outputs.rebuild_required == 'true'
        env:
          IOS_E2E_TEST_PLAN: CI-E2E
          IOS_E2E_DERIVED_DATA: '${{ env.IOS_CI_DERIVED_DATA }}'
          IOS_SOURCE_PACKAGES_DIR: '${{ env.IOS_CI_SOURCE_PACKAGES }}'
        run: bash scripts/build-ios-e2e-test-products.sh
      - name: Pack executable E2E products
        if: needs.ios-change-gate.outputs.reuse_e2e_products != 'true' || (steps.restore-reused-e2e-test-products.outputs.cache-hit != 'true' && steps.restore-legacy-reused-e2e-test-products.outputs.cache-hit != 'true') || steps.rebind-reused-e2e-test-products.outputs.rebuild_required == 'true'
        run: node ci/src/actions/ios/packE2eTestProducts.ts
      - name: Save exact-head E2E products
        id: save-e2e-test-products-cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: .example-ci/handoff/example-ios-e2e.xctestproducts.zip
          key: 'ios-e2e-test-products-v2-${{ env.ONBOARDING_E2E_COMMIT_SHA }}-${{ github.run_id }}'
      - name: Verify exact-head E2E cache publication
        id: verify-e2e-test-products-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: .example-ci/handoff/example-ios-e2e.xctestproducts.zip
          key: 'ios-e2e-test-products-v2-${{ env.ONBOARDING_E2E_COMMIT_SHA }}-${{ github.run_id }}'
          lookup-only: true
      - name: Upload exact-head E2E products fallback
        id: upload-e2e-test-products-fallback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: 'ios-e2e-test-products-fallback-${{ github.run_id }}'
          path: .example-ci/handoff/example-ios-e2e.xctestproducts.zip
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Verify E2E product handoff transport
        if: always() && !cancelled()
        env:
          TRANSPORT_FAILURE_POLICY: consumer-rebuild
          CACHE_SAVE_OUTCOME: '${{ steps.save-e2e-test-products-cache.outcome }}'
          CACHE_LOOKUP_OUTCOME: '${{ steps.verify-e2e-test-products-cache.outcome }}'
          CACHE_HIT: '${{ steps.verify-e2e-test-products-cache.outputs.cache-hit }}'
          ARTIFACT_OUTCOME: '${{ steps.upload-e2e-test-products-fallback.outcome }}'
        run: node ci/src/actions/ios/verifyTestProductHandoff.ts
      - name: Remove E2E handoff archive
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.example-ci/handoff/example-ios-e2e.xctestproducts.zip"
  prepare-dev-e2e-schema:
    name: Verify development E2E schema
    needs:
      - ios-change-gate
    if: always() && !cancelled() && ( ( github.event_name == 'workflow_dispatch' && inputs.test_scope == 'development-e2e-schema' ) || needs.ios-change-gate.outputs.real_server_evidence_reused == 'true' || ( needs.ios-change-gate.outputs.should_run == 'true' && ( needs.ios-change-gate.outputs.onboarding_required == 'true' || needs.ios-change-gate.outputs.chat_plaid_required == 'true' || needs.ios-change-gate.outputs.income_required == 'true' || ( needs.ios-change-gate.outputs.budget_required == 'true' && vars.IOS_ENABLE_BUDGET_E2E == 'true' ) || ( github.event_name == 'workflow_dispatch' && ( inputs.test_scope == 'e2e' || inputs.test_scope == 'evidence' || inputs.test_scope == 'debt-card-evidence' ) ) ) ) ) && ( ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.base.ref == 'develop' || github.event.pull_request.base.ref == 'main')) || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/develop')) || ( github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') ) )
