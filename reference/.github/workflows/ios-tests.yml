          IOS_NARROW_SIMULATOR_UDID: '${{ steps.narrow-simulator.outputs.provisioned_udid }}'
        run: node ../ci/src/actions/ios/removeProvisionedSimulators.ts
      - name: Bound persistent iOS build cache
        if: '${{ always() && steps.affected-tests.outputs.should_run == ''true'' && env.IOS_CI_BUILD_CACHE_ENTRY != '''' }}'
        env:
          IOS_CI_CACHE_LANE: main
        run: bash ../scripts/manage-ios-build-cache.sh prune "$IOS_CI_CACHE_LANE"
      - name: Remove current iOS runner artifacts
