          ref: '${{ env.EXAMPLE_CI_EXACT_HEAD_SHA }}'
          sparse-checkout: server/db
      - name: Checkout trusted schema verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted-verifier
          persist-credentials: false
          ref: '${{ needs.ios-change-gate.outputs.verifier_sha }}'
      - name: Set up the Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - name: Verify trusted schema verifier revision
        env:
          TRUSTED_CHECKOUT_PATH: trusted-verifier
          TRUSTED_VERIFIER_SHA: '${{ needs.ios-change-gate.outputs.verifier_sha }}'
        run: node trusted-verifier/ci/src/actions/ios/verifyTrustedSchemaVerifierRevision.ts
      - name: Install schema-verification dependencies
        working-directory: trusted-verifier
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Check trusted schema-revision verifier availability
        id: trusted-schema-revision-verifier
        env:
          TRUSTED_CHECKOUT_PATH: trusted-verifier
        run: node trusted-verifier/ci/src/actions/ios/checkSchemaRevisionVerifier.ts
      - name: Materialize pull-request migrations as inert data
        if: steps.trusted-schema-revision-verifier.outputs.available == 'true'
        working-directory: trusted-verifier
        env:
          E2E_REQUIRED_MIGRATIONS_MANIFEST: '${{ runner.temp }}/example-e2e-required-migrations-${{ github.run_id }}.json'
        run: ./node_modules/.bin/tsx server/scripts/materializeDevE2eSchemaRevision.ts "$GITHUB_WORKSPACE/pr-source" "$GITHUB_WORKSPACE/pr-source/server/db/migrations" "$E2E_REQUIRED_MIGRATIONS_MANIFEST"
      - name: Authenticate trusted schema verification to GCP
        id: schema-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: example-app
          workload_identity_provider: projects/123456789012/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-ci@example-app.iam.gserviceaccount.com
      - name: Verify development E2E schema revision
        id: schema-revision
        if: steps.trusted-schema-revision-verifier.outputs.available == 'true'
        working-directory: trusted-verifier
        env:
          E2E_REQUIRED_MIGRATIONS_MANIFEST: '${{ runner.temp }}/example-e2e-required-migrations-${{ github.run_id }}.json'
        continue-on-error: true
        run: ./node_modules/.bin/tsx server/scripts/verifyDevE2eSchemaRevision.ts
      - name: Verify development E2E schema objects
        id: schema-objects
        if: '${{ !cancelled() && steps.schema-auth.outcome == ''success'' }}'
        working-directory: trusted-verifier
        continue-on-error: true
        run: ./node_modules/.bin/tsx server/scripts/verifyPlaidSchedulerSchema.ts
      - name: Enforce development E2E schema verification
        if: '${{ !cancelled() }}'
        env:
          REVISION_REQUIRED: '${{ steps.trusted-schema-revision-verifier.outputs.available }}'
          REVISION_OUTCOME: '${{ steps.schema-revision.outcome }}'
          OBJECT_OUTCOME: '${{ steps.schema-objects.outcome }}'
        run: node trusted-verifier/ci/src/actions/ios/enforceDevE2eSchemaVerification.ts
      - name: Remove migration manifest
        if: always()
        run: node trusted-verifier/ci/src/actions/ios/removeMigrationManifest.ts
