          IOS_RUNNER_SHUTDOWN_BOOTED_LEGACY_SIMULATORS: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''1'' || '''' }}'
          IOS_RUNNER_RECLAIM_XCTEST_DEVICES: '1'
          IOS_RUNNER_RECLAIM_LOCAL_IOS_ARTIFACTS: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''1'' || '''' }}'
          EXAMPLE_LOCAL_IOS_ARTIFACT_ROOT: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''/private/tmp'' || '''' }}'
          IOS_RUNNER_RECLAIM_XCODEBUILDMCP_EXAMPLE_ARTIFACTS: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''1'' || '''' }}'
          IOS_RUNNER_XCODEBUILDMCP_EXAMPLE_WORKSPACE_NAME: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''example-app-8f1cba0234bb'' || '''' }}'
          IOS_RUNNER_RECLAIM_XCODE_ARCHIVES: '${{ runner.name == ''t-runner-2'' && ''1'' || '''' }}'
          IOS_RUNNER_RECLAIM_XCODE_DEVICE_SUPPORT: '${{ runner.name == ''t-runner-2'' && ''1'' || '''' }}'
          IOS_RUNNER_RECLAIM_LEGACY_SIMULATOR_NAME: '${{ runner.name == ''t-runner-2'' && ''iPhone 17'' || runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''iPhone 13 mini Test'' || '''' }}'
          IOS_RUNNER_RECLAIM_LEGACY_SIMULATOR_RUNTIME: '${{ runner.name == ''t-runner-2'' && ''com.apple.CoreSimulator.SimRuntime.iOS-26-2'' || runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''com.apple.CoreSimulator.SimRuntime.iOS-26-3'' || '''' }}'
          IOS_RUNNER_RECLAIM_LEGACY_SIMULATOR_UDID: '${{ runner.name == ''t-runner-2'' && ''4e07f379-2a83-5804-81ae-2e043229a548'' || runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''e2ef0691-a80c-5318-9d17-8a017a20e1e0'' || '''' }}'
