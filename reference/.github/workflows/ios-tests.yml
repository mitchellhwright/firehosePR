        run: bash ../scripts/manage-ios-build-cache.sh prepare "$IOS_CI_CACHE_LANE"
      - name: Reset CoreSimulator host
        run: bash "$GITHUB_WORKSPACE/scripts/ensure-ios-simulator-host.sh"
      - name: Provision unit-test simulator
