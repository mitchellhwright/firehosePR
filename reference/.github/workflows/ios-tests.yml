          IOS_3996_EVIDENCE_DIR: '${{ env.IOS_3996_EVIDENCE_DIR }}'
          IOS_3996_CLEANUP_RECEIPT: '${{ env.IOS_3996_CLEANUP_RECEIPT }}'
          IOS_3996_EVIDENCE_JSON: '${{ env.IOS_3996_EVIDENCE_JSON }}'
