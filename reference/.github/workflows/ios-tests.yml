          IOS_ONLY_TESTING_FILE: '${{ steps.affected-tests.outputs.only_testing_file }}'
          IOS_TEST_SELECTION_MODE: '${{ steps.affected-tests.outputs.mode }}'
          IOS_EVIDENCE_GROUPS: '${{ steps.evidence-shard.outputs.evidence_groups }}'
          IOS_ACCOUNT_UPDATE_GROUP_REQUIRED: '${{ contains(steps.affected-tests.outputs.evidence_groups, ''account-update'') && ''true'' || ''false'' }}'
          IOS_ACCOUNT_UPDATE_TEST_COUNT: '${{ steps.affected-tests.outputs.account_update_test_count }}'
          IOS_UI_METHOD_OWNERS: '${{ needs.ios-change-gate.outputs.native_ui_method_owners }}'
          IOS_PRIMARY_DESTINATION: '${{ steps.primary-simulator.outputs.dest }}'
          IOS_NARROW_DESTINATION: '${{ steps.narrow-simulator.outputs.dest }}'
