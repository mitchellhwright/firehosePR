          IOS_AFFECTED_TESTS_CHANGED_FILES: '${{ github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''evidence'' && ''ios/example-iosUITests/CardAccountUpdateReturnCashSavingsUITests.swift'' || github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''onboarding-copy-evidence'' && ''ios/example-iosUITests/OnboardingCopyAccessibilityEvidenceUITests.swift'' || github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''shared-cta-evidence'' && ''ios/example-iosUITests/CardEditFirstTapEvidenceUITests.swift'' || github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''mortgage-assignment-evidence'' && ''ios/example-iosTests/MortgageAssignmentDraftModelTests.swift'' || github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''financial-independence-evidence'' && ''ios/example-iosTests/FinancialIndependenceEvidenceTests.swift'' || needs.ios-change-gate.outputs.native_changed_files || '''' }}'
          IOS_AFFECTED_TESTS_CHANGED_FILES_EXPLICIT_EMPTY: '${{ needs.ios-change-gate.outputs.native_changed_files_explicit_empty }}'
          IOS_AFFECTED_TESTS_HEAD: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
          IOS_AFFECTED_TESTS_LANE: main
          IOS_AFFECTED_TESTS_MODE: '${{ needs.ios-change-gate.outputs.native_mode }}'
          IOS_AFFECTED_TESTS_STOREKIT_REQUIRED: '${{ needs.ios-change-gate.outputs.storekit_required }}'
          IOS_AFFECTED_TESTS_WORKSPACE: '${{ github.workspace }}'
        run: node ../.ci/trusted-native-controls/scripts/select-ios-affected-tests.ts
      - name: Resolve native product build mode
        id: product-build-mode
        env:
          PREPARED_SELECTION_MODE: '${{ steps.affected-tests.outputs.mode }}'
          PREPARED_UI_REQUIRED: '${{ needs.ios-change-gate.outputs.native_ui_required }}'
          PREPARED_EVIDENCE_GROUPS: '${{ steps.affected-tests.outputs.evidence_groups }}'
          PREPARED_NARROW_PAYWALL_REQUIRED: '${{ steps.affected-tests.outputs.narrow_paywall_required }}'
          FORCED_EXECUTION_LANES: '${{ needs.ios-change-gate.outputs.rerun_ios_lanes }}'
          FULL_EXECUTION_LANES: '${{ needs.ios-change-gate.outputs.native_full_execution_lanes }}'
