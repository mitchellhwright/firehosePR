      IOS_E2E_TEST_PRODUCTS: '${{ github.workspace }}/.example-ci/e2e-test-products/example-ios-e2e.xctestproducts'
    steps:
      - name: Checkout exact E2E revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: 'blob:none'
          persist-credentials: false
          ref: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
      - name: Set up the Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - name: Checkout typed iOS revision guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ needs.ios-change-gate.outputs.verifier_sha || env.EXAMPLE_CI_TRUSTED_BASE_SHA }}'
          path: .ci/trusted-ios-revision-guard
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            ci
      - name: Verify exact E2E revision
        env:
          GH_TOKEN: '${{ github.token }}'
          EXACT_HEAD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
