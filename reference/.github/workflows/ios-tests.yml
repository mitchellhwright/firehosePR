          IOS_WELLNESS_REQUIRED: '${{ steps.affected-tests.outputs.wellness_required }}'
          IOS_WELLNESS_ONLY_TESTING_FILE: '${{ steps.affected-tests.outputs.wellness_only_testing_file }}'
          IOS_WELLNESS_TEST_COUNT: '${{ steps.affected-tests.outputs.wellness_test_count }}'
          IOS_TEST_EXECUTION_MIN_FREE_KB: '${{ startsWith(matrix.lane, ''evidence-'') && needs.ios-change-gate.outputs.ios_evidence_macos_minimum_execution_free_kb || needs.ios-change-gate.outputs.ios_macos_minimum_execution_free_kb }}'
          IOS_CI_CACHE_LANE: main
          EXACT_HEAD_SHA: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
        run: node ../ci/src/actions/ios/executePrecompiledTests.ts
      - name: Summarize iOS Test Failures
        id: summarize-ios-test-failures
        if: 'always() && steps.affected-tests.outputs.should_run == ''true'' && contains(fromJSON(''["success", "failure", "cancelled"]''), steps.execute-tests.outcome)'
        run: node ../ci/src/actions/ios/summarizeIosTestFailures.ts
      - name: Export iOS Test Screenshots
        id: export-ios-test-screenshots
        if: 'always() && steps.affected-tests.outputs.should_run == ''true'' && ((matrix.lane == ''native1'' && github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''financial-independence-evidence'') || startsWith(matrix.lane, ''evidence-''))'
        run: node ../ci/src/actions/ios/exportIosTestScreenshots.ts
      - name: Validate financial independence evidence
        id: validate-financial-independence
