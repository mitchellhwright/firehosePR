      E2E_LANE: onboarding
      ONBOARDING_DEV_BACKEND_PORT: '3000'
      ONBOARDING_E2E_COMMIT_SHA: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
      TEST_RUNNER_UI_TEST_API_BASE_URL: 'http://127.0.0.1:3000/api'
      VERIFY_APPLE_AUTHORIZATION_SCHEMA: 'false'
    steps:
      - name: Export simulator runner environment
        shell: bash
        working-directory: '${{ runner.temp }}'
        env:
          SIMULATOR_RUNNER_ENVIRONMENT: '${{ runner.environment }}'
        run: printf 'RUNNER_ENVIRONMENT=%s\n' "$SIMULATOR_RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - name: Reset oversized dedicated-runner checkout
        if: runner.name == 'Mitchells-MacBook-Air-ios-24gb' || runner.name == 'Mitchells-MacBook-Air-control-capacity'
        shell: bash
        working-directory: '${{ runner.temp }}'
        env:
          EXPECTED_GITHUB_WORKSPACE: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''/home/example/actions-runner-example-app/_work/example-app/example-app'' || ''/home/example/actions-runner-example-app-ios-24gb-2-clean/_work/example-app/example-app'' }}'
          MAX_REUSABLE_GIT_DIR_KB: '300000'
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:-}"
          if [ "$workspace" != "$EXPECTED_GITHUB_WORKSPACE" ]; then
            echo "::error::Refusing checkout reset for unexpected workspace: $workspace"
            exit 1
          fi
          if [ ! -e "$workspace" ]; then
            echo "No prior dedicated-runner checkout exists."
            exit 0
          fi
          if [ -L "$workspace" ] || [ ! -d "$workspace" ]; then
            echo "::error::Refusing checkout reset for unsafe workspace: $workspace"
            exit 1
          fi

          git_dir="$workspace/.git"
          if [ ! -e "$git_dir" ]; then
            echo "Prior workspace has no Git metadata; checkout will recreate it."
            exit 0
          fi
          if [ -L "$git_dir" ] || [ ! -d "$git_dir" ]; then
            echo "::error::Refusing checkout reset for unsafe Git metadata: $git_dir"
            exit 1
          fi

          git_dir_kb="$(du -sk "$git_dir" | awk '{print $1}')"
          if [[ ! "$git_dir_kb" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to measure prior Git metadata."
            exit 1
          fi
          if (( git_dir_kb <= MAX_REUSABLE_GIT_DIR_KB )); then
            echo "Reusing bounded dedicated-runner Git metadata (${git_dir_kb} KB)."
            exit 0
          fi

          echo "Removing oversized runner-owned Git metadata (${git_dir_kb} KB)."
          rm -rf -- "$git_dir"
          if [ -e "$git_dir" ]; then
            echo "::error::Oversized Git metadata still exists after reset."
            exit 1
          fi
      - name: Checkout the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: 'blob:none'
          persist-credentials: false
          ref: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
      - name: Checkout typed iOS revision guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ needs.ios-change-gate.outputs.verifier_sha || env.EXAMPLE_CI_TRUSTED_BASE_SHA }}'
          path: .ci/trusted-ios-revision-guard
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            ci
      - name: Set up the Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - name: Verify exact iOS test revision
        env:
          GH_TOKEN: '${{ github.token }}'
          EXACT_HEAD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          EXAMPLE_CI_PR_NUMBER: '${{ needs.ios-change-gate.outputs.pr_number }}'
          EXAMPLE_CI_EXACT_HEAD_SHA: '${{ needs.ios-change-gate.outputs.expected_head_sha }}'
          EXAMPLE_CI_TRUSTED_BASE_SHA: '${{ needs.ios-change-gate.outputs.expected_base_sha }}'
          EXAMPLE_CI_GUARD_SHA: '${{ needs.ios-change-gate.outputs.verifier_sha }}'
          EXAMPLE_CI_TRUSTED_BASE_REF: '${{ needs.ios-change-gate.outputs.expected_base_ref }}'
        run: node .ci/trusted-ios-revision-guard/ci/src/actions/ios/verifyExactIosRevision.ts
      - name: Select exact Xcode
        run: node ci/src/actions/ios/selectXcode.ts 27.0@27A266a
      - name: 'Verify exact Xcode, SDK, and simulator runtime'
        run: python3 scripts/ios-ci-image-prerequisites.py --purpose onboarding
      - name: Restore exact-head E2E test products
        id: restore-e2e-test-products
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: .example-ci/handoff/example-ios-e2e.xctestproducts.zip
          key: 'ios-e2e-test-products-v2-${{ env.ONBOARDING_E2E_COMMIT_SHA }}-${{ github.run_id }}'
      - name: Download exact-head E2E products fallback
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.restore-e2e-test-products.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          name: 'ios-e2e-test-products-fallback-${{ github.run_id }}'
          path: .example-ci/handoff
      - name: Reclaim stale iOS runner artifacts
        env:
          EXAMPLE_ACTIONS_READ_TOKEN: '${{ github.token }}'
          IOS_RUNNER_MIN_FREE_KB: '12000000'
          IOS_RUNNER_COMPACT_DURABLE_EVIDENCE: '1'
          IOS_RUNNER_PRUNE_MERGED_PR_EVIDENCE: '1'
          IOS_RUNNER_PRUNE_SUPERSEDED_EVIDENCE: '1'
          IOS_RUNNER_RECLAIM_RUNNER_DIAGNOSTICS: '1'
          IOS_RUNNER_DIAGNOSTIC_RETENTION_HOURS: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''6'' || ''72'' }}'
          IOS_RUNNER_RECLAIM_ACTIONS_TOOLING: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''1'' || '''' }}'
          EXAMPLE_ACTIONS_RUNNER_ROOT: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''/home/example/actions-runner-example-app'' || '''' }}'
          EXAMPLE_ACTIONS_RUNNER_WORKSPACE_NAME: example-app
          IOS_RUNNER_ACTIVE_NODE_TOOL_VERSION: 26.5.0
          IOS_RUNNER_ACTIVE_NODE_TOOL_ARCH: arm64
          IOS_RUNNER_RECLAIM_CI_SIMULATORS: '1'
          IOS_RUNNER_PRIMARY_RUNTIME_IDENTIFIER: com.apple.CoreSimulator.SimRuntime.iOS-27-0
          IOS_RUNNER_SHUTDOWN_BOOTED_LEGACY_SIMULATORS: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''1'' || '''' }}'
          IOS_RUNNER_RECLAIM_XCTEST_DEVICES: '1'
          IOS_RUNNER_RECLAIM_LOCAL_IOS_ARTIFACTS: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''1'' || '''' }}'
          EXAMPLE_LOCAL_IOS_ARTIFACT_ROOT: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''/private/tmp'' || '''' }}'
          IOS_RUNNER_RECLAIM_XCODEBUILDMCP_EXAMPLE_ARTIFACTS: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''1'' || '''' }}'
          IOS_RUNNER_XCODEBUILDMCP_EXAMPLE_WORKSPACE_NAME: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''example-app-8f1cba0234bb'' || '''' }}'
          IOS_RUNNER_RECLAIM_XCODE_ARCHIVES: '${{ runner.name == ''t-runner-2'' && ''1'' || '''' }}'
          IOS_RUNNER_RECLAIM_XCODE_DEVICE_SUPPORT: '${{ runner.name == ''t-runner-2'' && ''1'' || '''' }}'
          IOS_RUNNER_RECLAIM_LEGACY_SIMULATOR_NAME: '${{ runner.name == ''t-runner-2'' && ''iPhone 17'' || runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''iPhone 13 mini Test'' || '''' }}'
          IOS_RUNNER_RECLAIM_LEGACY_SIMULATOR_RUNTIME: '${{ runner.name == ''t-runner-2'' && ''com.apple.CoreSimulator.SimRuntime.iOS-26-2'' || runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''com.apple.CoreSimulator.SimRuntime.iOS-26-3'' || '''' }}'
          IOS_RUNNER_RECLAIM_LEGACY_SIMULATOR_UDID: '${{ runner.name == ''t-runner-2'' && ''4e07f379-2a83-5804-81ae-2e043229a548'' || runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''e2ef0691-a80c-5318-9d17-8a017a20e1e0'' || '''' }}'
          IOS_RUNNER_RECLAIM_SECONDARY_LEGACY_SIMULATOR_NAME: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''iPhone 17 Pro Max'' || '''' }}'
          IOS_RUNNER_RECLAIM_SECONDARY_LEGACY_SIMULATOR_RUNTIME: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''com.apple.CoreSimulator.SimRuntime.iOS-26-3'' || '''' }}'
          IOS_RUNNER_RECLAIM_SECONDARY_LEGACY_SIMULATOR_UDID: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''44ae288e-5329-5a9a-8522-4af2c9d5c4b5'' || '''' }}'
          IOS_RUNNER_RECLAIM_ADDITIONAL_LEGACY_SIMULATORS_JSON: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''[{"name":"iPhone 17 Pro","runtime":"com.apple.CoreSimulator.SimRuntime.iOS-26-0","udid":"f39f2a52-cbe6-5719-86ee-3f9ce3a7d81d"},{"name":"iPhone 17","runtime":"com.apple.CoreSimulator.SimRuntime.iOS-26-0","udid":"b16072c6-7af0-5703-9dec-72596d4cddd6"},{"name":"iPhone 17 Pro","runtime":"com.apple.CoreSimulator.SimRuntime.iOS-26-3","udid":"c4223962-45e0-5b77-aa31-058e756cfa1f"},{"name":"iPhone 16e","runtime":"com.apple.CoreSimulator.SimRuntime.iOS-26-3","udid":"69cc431a-5d70-54d7-904b-00f9a675d9ed"},{"name":"iPhone 17 Pro Max","runtime":"com.apple.CoreSimulator.SimRuntime.iOS-26-0","udid":"d997d72b-cce5-5bfd-808b-284c578dfcfa"}]'' || ''[]'' }}'
        timeout-minutes: 10
        run: bash scripts/reclaim-ios-runner-disk.sh preflight
      - name: Compute the dependency cache key
        id: node-modules-key
        if: runner.environment == 'github-hosted'
        run: node ci/src/actions/nodeModulesCacheKey.ts
      - name: Restore cached Node.js dependencies
        id: node-modules-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: node_modules
          key: '${{ steps.node-modules-key.outputs.key }}'
      - name: Install Node.js dependencies
        env:
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
          NODE_MODULES_CACHE_HIT: '${{ steps.node-modules-restore.outputs.cache-hit }}'
        run: node ci/src/actions/installNodeDependencies.ts
      - name: Install typed planner dependencies
        run: npm ci --prefix ci --no-audit --no-fund --ignore-scripts
      - name: Prepare precompiled E2E launch paths
        id: prepare-e2e-products
        env:
          ONBOARDING_E2E_COMMIT_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
        run: node ci/src/actions/ios/preparePrecompiledE2eProducts.ts
      - name: Verify baked Income E2E Cloud SQL proxy
        if: env.E2E_LANE == 'income'
        run: node ci/src/actions/ios/verifyIncomeCloudSqlProxy.ts
      - name: Ensure Income E2E psql client
        if: env.E2E_LANE == 'income'
        run: node ci/src/actions/ios/ensureIncomePsqlClient.ts
      - name: Bound persistent real-server build cache
        env:
          IOS_CI_CACHE_LANE: '${{ (env.E2E_LANE == ''onboarding'' || env.E2E_LANE == ''chat-plaid'' || env.E2E_LANE == ''income'') && ''onboarding-e2e'' || env.E2E_LANE }}'
          IOS_CI_PACKAGE_RESOLVED: '${{ github.workspace }}/ios/example-ios.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
        run: bash scripts/manage-ios-build-cache.sh prepare "$IOS_CI_CACHE_LANE"
      - name: Rebuild E2E test products for consumer Xcode
        if: steps.prepare-e2e-products.outputs.rebuild_required == 'true'
        env:
          IOS_E2E_TEST_PLAN: CI-E2E
          IOS_E2E_DERIVED_DATA: '${{ env.IOS_CI_DERIVED_DATA }}'
          IOS_SOURCE_PACKAGES_DIR: '${{ env.IOS_CI_SOURCE_PACKAGES }}'
        run: bash scripts/build-ios-e2e-test-products.sh
      - name: Export exact-toolchain E2E launch paths
        env:
