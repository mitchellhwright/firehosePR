        if: needs.ios-change-gate.outputs.native_handoff_required == 'true'
        continue-on-error: true
        with:
          path: .example-ci/handoff/example-ios-native-products.zip
          key: 'ios-native-test-products-v1-${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}-${{ github.run_id }}'
      - name: Verify exact-head native cache publication
        id: verify-native-test-products-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.ios-change-gate.outputs.native_handoff_required == 'true'
        continue-on-error: true
        with:
          path: .example-ci/handoff/example-ios-native-products.zip
          key: 'ios-native-test-products-v1-${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}-${{ github.run_id }}'
          lookup-only: true
      - name: Upload exact-head native products fallback
        id: upload-native-test-products-fallback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.ios-change-gate.outputs.native_handoff_required == 'true' && (steps.verify-native-test-products-cache.outcome != 'success' || steps.verify-native-test-products-cache.outputs.cache-hit != 'true')
        continue-on-error: true
        with:
          name: 'ios-native-test-products-fallback-${{ github.run_id }}'
          path: .example-ci/handoff/example-ios-native-products.zip
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Verify native product handoff transport
        if: always() && !cancelled() && needs.ios-change-gate.outputs.native_handoff_required == 'true'
        env:
