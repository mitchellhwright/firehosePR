          PACKAGE_CACHE: '${{ env.ONBOARDING_E2E_RUN_DIR }}/PackageCache'
          EXPECTED_HEAD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
        timeout-minutes: 25
        run: bash scripts/verify-card-rewards-release-archive.sh
