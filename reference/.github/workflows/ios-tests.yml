        run: node ../ci/src/actions/ios/retainIosCiEvidence.ts
      - name: Upload iOS Test Diagnostics
        id: upload-ios-test-diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.affected-tests.outputs.should_run == 'true' && (steps.rebuild-native-products.outcome == 'failure' || steps.execute-tests.outcome == 'failure' || steps.summarize-ios-test-failures.outcome == 'failure' || steps.validate-financial-independence.outcome == 'failure' || steps.validate-onboarding-copy.outcome == 'failure' || steps.export-ios-test-screenshots.outcome == 'failure')
        continue-on-error: true
        with:
          name: 'ios-test-${{ matrix.lane }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}'
          compression-level: 0
          retention-days: 1
          path: |
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/example-ios-tests.xcresult
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/example-ios-storekit-tests.xcresult
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/example-ios-account-update-tests.xcresult
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/example-ios-accessibility-tests.xcresult
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/*.first-launch-failure.xcresult
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/narrow-paywall-lane.xcresult
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/xcodebuild.log
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/build-xcodebuild.log
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/storekit-xcodebuild.log
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/account-update-xcodebuild.log
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/accessibility-xcodebuild.log
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/narrow-paywall-lane-xcodebuild.log
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/*.first-launch-busy.log
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/**/*.storekit-prime.log
          if-no-files-found: ignore
      - name: Upload iOS Busy retry diagnostics
        id: upload-ios-busy-retry-diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.affected-tests.outputs.should_run == 'true' && steps.execute-tests.outcome == 'failure'
        continue-on-error: true
        with:
          name: 'ios-test-${{ matrix.lane }}-busy-retry-${{ github.run_id }}-${{ github.run_attempt }}'
          compression-level: 0
          retention-days: 1
          path: |
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/**/*.first-launch-failure.xcresult
            ${{ runner.temp }}/example-ios-tests.${{ github.run_id }}.${{ github.run_attempt }}.*/**/*.first-launch-busy.log
          if-no-files-found: ignore
      - name: Retain iOS Test diagnostics on runner
        if: always() && (steps.upload-ios-test-diagnostics.outcome == 'failure' || steps.upload-ios-busy-retry-diagnostics.outcome == 'failure')
        env:
          EXECUTION_LANE: '${{ matrix.lane }}'
          IOS_RETAINED_EVIDENCE: diagnostics
        run: node ../ci/src/actions/ios/retainIosCiEvidence.ts
      - name: Remove provisioned iOS Simulators
        if: always() && steps.affected-tests.outputs.should_run == 'true'
        env:
          IOS_CI_LANE: '${{ startsWith(matrix.lane, ''evidence-'') && ''evidence'' || matrix.lane }}'
          IOS_EVIDENCE_GROUPS: '${{ steps.evidence-shard.outputs.evidence_groups }}'
