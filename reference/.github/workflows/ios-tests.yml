      - name: Restore exact-head debt-card test products
        id: restore-debt-card-test-products
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'debt-card-evidence'
        with:
          path: '${{ steps.onboarding-paths.outputs.debt_card_cache_dir }}'
          key: '${{ steps.debt-card-build-key.outputs.cache_key }}'
      - name: Validate exact-head debt-card test products
        id: validate-debt-card-test-products
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'debt-card-evidence'
        env:
          BUILD_FINGERPRINT: '${{ steps.debt-card-build-key.outputs.build_fingerprint }}'
          CACHE_HIT: '${{ steps.restore-debt-card-test-products.outputs.cache-hit }}'
          EXACT_HEAD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          MANIFEST_PATH: '${{ steps.onboarding-paths.outputs.debt_card_cache_manifest }}'
          TEST_PRODUCTS_PATH: '${{ steps.onboarding-paths.outputs.debt_card_test_products }}'
        run: node ci/src/actions/ios/validateDebtCardTestProducts.ts
      - name: Build exact-head debt-card test products
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'debt-card-evidence' && steps.validate-debt-card-test-products.outputs.usable != 'true'
        env:
          BUILD_FINGERPRINT: '${{ steps.debt-card-build-key.outputs.build_fingerprint }}'
          CACHE_DIR: '${{ steps.onboarding-paths.outputs.debt_card_cache_dir }}'
          EXACT_HEAD_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
          MANIFEST_PATH: '${{ steps.onboarding-paths.outputs.debt_card_cache_manifest }}'
          TEST_PRODUCTS_PATH: '${{ steps.onboarding-paths.outputs.debt_card_test_products }}'
          ONBOARDING_E2E_RUN_DIR: '${{ env.ONBOARDING_E2E_RUN_DIR }}'
        run: node ci/src/actions/ios/buildDebtCardTestProducts.ts
      - name: Save exact-head debt-card test products
