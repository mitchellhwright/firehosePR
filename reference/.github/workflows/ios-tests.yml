        id: restore-reused-e2e-test-products
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.ios-change-gate.outputs.reuse_e2e_products == 'true'
        continue-on-error: true
