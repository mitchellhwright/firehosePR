    concurrency:
      group: 'ios-${{ fromJSON((github.event_name == ''pull_request'' && toJSON(format(''pr-{0}'', github.event.pull_request.number))) || (github.event_name == ''merge_group'' && toJSON(format(''mq-{0}'', github.event.merge_group.head_ref))) || (github.event_name == ''workflow_dispatch'' && toJSON(format(''event-{0}'', github.run_id))) || toJSON(format(''event-{0}'', github.run_id))) }}-native-${{ matrix.lane }}'
      cancel-in-progress: '${{ github.event_name == ''pull_request'' && github.event.action == ''synchronize'' }}'
