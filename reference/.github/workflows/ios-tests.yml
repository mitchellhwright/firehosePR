          TEST_RUNNER_UI_TEST_EMAIL: '${{ env.CHAT_PLAID_E2E_EMAIL }}'
          TEST_RUNNER_UI_TEST_PASSWORD: '${{ env.CHAT_PLAID_E2E_PASSWORD }}'
          DESTINATION: '${{ steps.sim.outputs.dest }}'
          XCTESTRUN_PATH: '${{ env.XCTESTRUN_PATH }}'
          ONBOARDING_E2E_RUN_DIR: '${{ env.ONBOARDING_E2E_RUN_DIR }}'
          CHAT_PLAID_E2E_RESULT_BUNDLE: '${{ env.CHAT_PLAID_E2E_RESULT_BUNDLE }}'
          CHAT_PLAID_E2E_XCODEBUILD_LOG: '${{ env.CHAT_PLAID_E2E_XCODEBUILD_LOG }}'
        run: node ci/src/actions/ios/runChatPlaidE2e.ts
