          IOS_CI_LANE: main
          IOS_ONLY_TESTING_FILE: '${{ steps.affected-tests.outputs.only_testing_file }}'
          IOS_TEST_SELECTION_MODE: '${{ steps.product-build-mode.outputs.mode }}'
          IOS_NARROW_PAYWALL_REQUIRED: '${{ steps.affected-tests.outputs.narrow_paywall_required }}'
          IOS_EVIDENCE_GROUPS: '${{ steps.affected-tests.outputs.evidence_groups }}'
