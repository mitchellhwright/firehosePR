        run: node .ci/trusted-ios-revision-guard/ci/src/actions/ios/verifyExactIosRevision.ts
      - name: Select exact Xcode
        run: node ci/src/actions/ios/selectXcode.ts 27.0@27A266a
      - name: 'Verify exact Xcode, SDK, and simulator runtime'
