          IOS_RUNNER_CURRENT_SIMULATOR_UDID: '${{ steps.sim.outputs.provisioned_udid }}'
          IOS_RUNNER_RECLAIM_CI_SIMULATORS: '1'
        run: bash scripts/reclaim-ios-runner-disk.sh simulator
      - name: Stop onboarding dev backend supervisor
        if: always()
        env:
          ONBOARDING_DEV_BACKEND_PORT: '${{ env.ONBOARDING_DEV_BACKEND_PORT }}'
          ONBOARDING_DEV_BACKEND_WORKSPACE: '${{ github.workspace }}'
        run: bash scripts/stop-onboarding-dev-backend.sh
      - name: Remove isolated Google Cloud SDK state
        if: always()
        run: node .ci/trusted-ios-revision-guard/ci/src/actions/ios/removeIsolatedCloudSdkState.ts
      - name: Prune bounded real-server build cache
        if: always() && env.IOS_CI_BUILD_CACHE_ENTRY != ''
        run: bash scripts/manage-ios-build-cache.sh prune "$IOS_CI_CACHE_LANE"
      - name: Remove current iOS runner artifacts
        if: always()
        run: bash scripts/reclaim-ios-runner-disk.sh current
  budget-e2e:
    name: 'Real-server E2E execution (budget-${{ matrix.shard }})'
    needs:
      - ios-change-gate
      - confirm-current-ios-pr
      - build-ios-e2e-test-products
      - prepare-dev-e2e-schema
    if: always() && !cancelled() && needs.confirm-current-ios-pr.outputs.current == 'true' && needs.build-ios-e2e-test-products.result == 'success' && needs.prepare-dev-e2e-schema.result == 'success' && (vars.IOS_ENABLE_BUDGET_E2E == 'true' || (github.event_name == 'workflow_dispatch' && inputs.test_scope == 'debt-card-evidence')) && needs.ios-change-gate.outputs.should_run == 'true' && needs.ios-change-gate.outputs.budget_required == 'true' && ((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.base.ref == 'develop' || github.event.pull_request.base.ref == 'main')) || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/develop'))) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && inputs.test_scope != 'mortgage-assignment-evidence' && inputs.test_scope != 'evidence'))
    runs-on:
      group: '${{ ((github.event_name == ''pull_request'' || github.event_name == ''merge_group'') || (github.event_name == ''workflow_dispatch'' && inputs.mac_runner == ''mitchell-reserved'') || (github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''promotion-evidence'')) && ''example-reviewed-pr-macs'' || ''example-team-macs'' }}'
      labels: '${{ fromJson((github.event_name == ''workflow_dispatch'' && inputs.mac_runner == ''mitchell-reserved'') && ''["self-hosted","macOS","ios-reserved-mitchell"]'' || ''["self-hosted","macOS","ios-xcode"]'') }}'
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    environment:
      name: development-e2e
    concurrency:
      group: 'ios-${{ fromJSON((github.event_name == ''pull_request'' && toJSON(format(''pr-{0}'', github.event.pull_request.number))) || (github.event_name == ''merge_group'' && toJSON(format(''mq-{0}'', github.event.merge_group.head_ref))) || (github.event_name == ''workflow_dispatch'' && toJSON(format(''event-{0}'', github.run_id))) || toJSON(format(''event-{0}'', github.run_id))) }}-budget-${{ matrix.shard }}'
      cancel-in-progress: '${{ github.event_name == ''pull_request'' && github.event.action == ''synchronize'' }}'
    strategy:
      matrix:
        shard: '${{ fromJSON(github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''debt-card-evidence'' && ''["a"]'' || ''["a","b"]'') }}'
      fail-fast: false
      max-parallel: 2
    env:
      E2E_LANE: budget
      BUDGET_E2E_SHARD: '${{ matrix.shard }}'
      BUDGET_E2E_ARTIFACT_SUFFIX: '-${{ matrix.shard }}'
      ONBOARDING_DEV_BACKEND_PORT: '3100'
      ONBOARDING_E2E_COMMIT_SHA: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
      TEST_RUNNER_UI_TEST_API_BASE_URL: 'http://127.0.0.1:3100/api'
      VERIFY_APPLE_AUTHORIZATION_SCHEMA: 'false'
    steps:
      - name: Export simulator runner environment
        shell: bash
        working-directory: '${{ runner.temp }}'
        env:
          SIMULATOR_RUNNER_ENVIRONMENT: '${{ runner.environment }}'
        run: printf 'RUNNER_ENVIRONMENT=%s\n' "$SIMULATOR_RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - name: Reset oversized dedicated-runner checkout
        if: runner.name == 'Mitchells-MacBook-Air-ios-24gb' || runner.name == 'Mitchells-MacBook-Air-control-capacity'
        shell: bash
        working-directory: '${{ runner.temp }}'
        env:
          EXPECTED_GITHUB_WORKSPACE: '${{ runner.name == ''Mitchells-MacBook-Air-ios-24gb'' && ''/home/example/actions-runner-example-app/_work/example-app/example-app'' || ''/home/example/actions-runner-example-app-ios-24gb-2-clean/_work/example-app/example-app'' }}'
          MAX_REUSABLE_GIT_DIR_KB: '300000'
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:-}"
          if [ "$workspace" != "$EXPECTED_GITHUB_WORKSPACE" ]; then
            echo "::error::Refusing checkout reset for unexpected workspace: $workspace"
            exit 1
          fi
          if [ ! -e "$workspace" ]; then
            echo "No prior dedicated-runner checkout exists."
            exit 0
          fi
          if [ -L "$workspace" ] || [ ! -d "$workspace" ]; then
            echo "::error::Refusing checkout reset for unsafe workspace: $workspace"
            exit 1
          fi

          git_dir="$workspace/.git"
          if [ ! -e "$git_dir" ]; then
            echo "Prior workspace has no Git metadata; checkout will recreate it."
            exit 0
          fi
          if [ -L "$git_dir" ] || [ ! -d "$git_dir" ]; then
            echo "::error::Refusing checkout reset for unsafe Git metadata: $git_dir"
            exit 1
          fi

          git_dir_kb="$(du -sk "$git_dir" | awk '{print $1}')"
          if [[ ! "$git_dir_kb" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to measure prior Git metadata."
            exit 1
          fi
          if (( git_dir_kb <= MAX_REUSABLE_GIT_DIR_KB )); then
            echo "Reusing bounded dedicated-runner Git metadata (${git_dir_kb} KB)."
            exit 0
          fi

          echo "Removing oversized runner-owned Git metadata (${git_dir_kb} KB)."
          rm -rf -- "$git_dir"
          if [ -e "$git_dir" ]; then
            echo "::error::Oversized Git metadata still exists after reset."
            exit 1
          fi
      - name: Checkout the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
