        if: always()
        run: bash scripts/reclaim-ios-runner-disk.sh current
  budget-e2e-video-processing:
    name: Budget E2E video processing (non-gating)
    needs:
      - ios-change-gate
      - budget-e2e
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.test_scope != 'debt-card-evidence' && needs.budget-e2e.result == 'failure'
    runs-on: '${{ fromJson((((github.event_name == ''pull_request'' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == ''merge_group'' || github.event_name == ''workflow_dispatch'')) && (vars.IOS_CONTROL_RUNNER_LABELS || ''["self-hosted","Linux","linux-remote"]'') || ''["ubuntu-24.04"]'') }}'
    permissions:
      actions: read
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout video tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: 'blob:none'
          persist-credentials: false
          ref: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
      - name: Setup Node for the typed video steps
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - name: Prepare isolated Budget video workspace
        run: node ci/src/actions/ios/prepareBudgetVideoWorkspace.ts
      - name: Download raw Budget video
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'budget-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*'
          path: '${{ runner.temp }}/budget-video-${{ github.run_id }}-${{ github.run_attempt }}/raw'
      - name: Process Budget video
        run: node ci/src/actions/ios/processBudgetVideo.ts
      - name: Upload processed Budget video
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: 'budget-e2e-video-${{ github.run_id }}-${{ github.run_attempt }}'
          path: '${{ env.BUDGET_E2E_COMPRESSED_VIDEO }}'
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14
  onboarding-e2e-status:
    name: '${{ github.event_name == ''workflow_dispatch'' && ''Manual - Onboarding E2E'' || ''Onboarding E2E'' }}'
    needs:
      - ios-change-gate
      - onboarding-e2e
      - chat-plaid-e2e
      - income-e2e
      - budget-e2e
      - prepare-dev-e2e-schema
    if: always() && !cancelled() && inputs.test_scope != 'observability-credential-sync' && ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    runs-on: '${{ fromJson(needs.ios-change-gate.outputs.control_runner_labels || (((github.event_name == ''pull_request'' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == ''merge_group'' || github.event_name == ''workflow_dispatch'') && ''["self-hosted","Linux","example-trusted-control"]'' || ''["ubuntu-24.04"]'')) }}'
    timeout-minutes: 10
    steps:
      - name: Checkout proven iOS verifier workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ needs.ios-change-gate.outputs.verifier_sha || env.EXAMPLE_CI_TRUSTED_BASE_SHA }}'
          persist-credentials: false
      - name: Setup Node for the typed aggregates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - name: Install typed aggregate dependencies
        run: npm ci --prefix ci --no-audit --no-fund --ignore-scripts
      - name: Verify exact-develop promotion verdict
        if: needs.ios-change-gate.outputs.production_promotion == 'true'
        env:
          EVENT_NAME: '${{ github.event_name }}'
          BASE_BRANCH: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.base.ref)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.base_ref == ''refs/heads/develop'' && ''develop'' || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON('''')) || toJSON(''ci-event-field-unavailable'')) }}'
          HEAD_BRANCH: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.ref)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_ref)) || (github.event_name == ''workflow_dispatch'' && toJSON('''')) || toJSON(''ci-event-field-unavailable'')) }}'
          REPOSITORY: '${{ github.repository }}'
          HEAD_REPOSITORY: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.repo.full_name)) || (github.event_name == ''merge_group'' && toJSON(github.repository)) || (github.event_name == ''workflow_dispatch'' && toJSON('''')) || toJSON(''ci-event-field-unavailable'')) }}'
          CHANGE_GATE_RESULT: '${{ needs.ios-change-gate.result }}'
          PROMOTION_CHECKPOINT_SHA: '${{ needs.ios-change-gate.outputs.promotion_checkpoint_sha }}'
          PROMOTION_PROVEN: '${{ needs.ios-change-gate.outputs.promotion_proven }}'
          PROMOTION_RUN_ID: '${{ needs.ios-change-gate.outputs.promotion_run_id }}'
        run: node ci/src/actions/ios/verifyPromotionVerdict.ts
      - name: Report reused queue evidence
        if: (github.event_name == 'merge_group') && hashFiles('ci/src/actions/ios/reportQueueEvidenceReuse.ts') != ''
        env:
          QUEUE_EVIDENCE_REUSE: '${{ needs.ios-change-gate.outputs.queue_evidence_reuse }}'
          CONTEXT_LANES: 'onboarding,chat-plaid,income,budget'
          MAIN_REQUIRED: '${{ needs.ios-change-gate.outputs.main_required }}'
          STOREKIT_REQUIRED: '${{ needs.ios-change-gate.outputs.storekit_required }}'
          EVIDENCE_REQUIRED: '${{ needs.ios-change-gate.outputs.evidence_required }}'
          NATIVE_SHOULD_RUN: '${{ needs.ios-change-gate.outputs.native_should_run }}'
          ONBOARDING_REQUIRED: '${{ needs.ios-change-gate.outputs.onboarding_required }}'
          CHAT_PLAID_REQUIRED: '${{ needs.ios-change-gate.outputs.chat_plaid_required }}'
          INCOME_REQUIRED: '${{ needs.ios-change-gate.outputs.income_required }}'
          BUDGET_REQUIRED: '${{ needs.ios-change-gate.outputs.budget_required }}'
          SCHEMA_PREPARATION_RESULT: '${{ needs.prepare-dev-e2e-schema.result }}'
        run: node ci/src/actions/ios/reportQueueEvidenceReuse.ts
      - name: Verify onboarding execution result
        if: needs.ios-change-gate.outputs.production_promotion != 'true'
        env:
          STATUS_AGGREGATE: onboarding-e2e-status
          CHANGE_GATE_RESULT: '${{ needs.ios-change-gate.result }}'
          EVENT_NAME: '${{ github.event_name }}'
          EXECUTION_RESULT: '${{ needs.onboarding-e2e.result }}'
          CHAT_PLAID_EXECUTION_RESULT: '${{ needs.chat-plaid-e2e.result }}'
          BUDGET_EXECUTION_RESULT: '${{ needs.budget-e2e.result }}'
          INCOME_EXECUTION_RESULT: '${{ needs.income-e2e.result }}'
          ONBOARDING_REQUIRED: '${{ needs.ios-change-gate.outputs.onboarding_required }}'
          CHAT_PLAID_REQUIRED: '${{ needs.ios-change-gate.outputs.chat_plaid_required }}'
          BUDGET_REQUIRED: '${{ needs.ios-change-gate.outputs.budget_required }}'
          INCOME_REQUIRED: '${{ needs.ios-change-gate.outputs.income_required }}'
          BUDGET_E2E_ENABLED: '${{ vars.IOS_ENABLE_BUDGET_E2E == ''true'' }}'
          HEAD_REPOSITORY: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.repo.full_name)) || (github.event_name == ''merge_group'' && toJSON(github.repository)) || (github.event_name == ''workflow_dispatch'' && toJSON('''')) || toJSON(''ci-event-field-unavailable'')) }}'
          REPOSITORY: '${{ github.repository }}'
          BASE_BRANCH: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.base.ref)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.base_ref == ''refs/heads/develop'' && ''develop'' || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON('''')) || toJSON(''ci-event-field-unavailable'')) }}'
          DISPATCH_REF: '${{ github.ref }}'
          TEST_SCOPE: '${{ inputs.test_scope || '''' }}'
          SCHEMA_PREPARATION_RESULT: '${{ needs.prepare-dev-e2e-schema.result }}'
        run: node ci/src/actions/ios/verifyRealServerE2eStatus.ts
  remove-run-artifacts-after-success:
    name: Remove run artifacts after success
    needs:
      - ios-change-gate
      - verify-ios-release-archive
      - build-ios-native-test-products
      - test-ios-execution
      - build-ios-e2e-test-products
      - onboarding-e2e
      - chat-plaid-e2e
      - income-e2e
      - budget-e2e
      - budget-e2e-video-processing
      - test-ios
    if: 'always() && !cancelled() && needs.ios-change-gate.result == ''success'' && needs.ios-change-gate.outputs.verifier_sha != '''' && !contains(needs.*.result, ''failure'') && !contains(needs.*.result, ''cancelled'')'
    runs-on: '${{ fromJson(needs.ios-change-gate.outputs.control_runner_labels || (((github.event_name == ''pull_request'' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == ''merge_group'' || github.event_name == ''workflow_dispatch'') && ''["self-hosted","Linux","example-trusted-control"]'' || ''["ubuntu-24.04"]'')) }}'
    permissions:
      actions: write
      contents: read
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout typed artifact cleanup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ needs.ios-change-gate.outputs.verifier_sha || env.EXAMPLE_CI_TRUSTED_BASE_SHA }}'
          path: .ci/trusted-artifact-cleanup
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            ci
      - name: Setup Node for the typed artifact cleanup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - name: Delete this run's artifacts
        env:
          GH_TOKEN: '${{ github.token }}'
          RUN_ID: '${{ github.run_id }}'
          REPOSITORY: '${{ github.repository }}'
        run: node .ci/trusted-artifact-cleanup/ci/src/actions/ios/removeRunArtifacts.ts
