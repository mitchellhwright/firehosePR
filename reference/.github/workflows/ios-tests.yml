        env:
          IOS_E2E_REUSED_HEAD_SHA: '${{ needs.ios-change-gate.outputs.reused_e2e_head_sha }}'
          IOS_E2E_REUSED_RUN_ID: '${{ needs.ios-change-gate.outputs.reused_e2e_run_id }}'
          IOS_E2E_REUSED_RUN_ATTEMPT: '${{ needs.ios-change-gate.outputs.reused_e2e_run_attempt }}'
          ONBOARDING_E2E_COMMIT_SHA: '${{ env.ONBOARDING_E2E_COMMIT_SHA }}'
