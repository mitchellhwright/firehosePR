      - name: Prepare onboarding result paths
        id: onboarding-paths
        env:
          E2E_LANE: '${{ env.E2E_LANE }}'
        run: node ci/src/actions/ios/prepareRealServerE2ePaths.ts
      - name: Compute exact-head debt-card build key
        id: debt-card-build-key
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'debt-card-evidence'
        env:
