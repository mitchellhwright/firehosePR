  verify-ios-release-archive:
    name: Verify unsigned Release archive
    needs:
      - ios-change-gate
      - confirm-current-ios-pr
    if: always() && !cancelled() && needs.confirm-current-ios-pr.outputs.current == 'true' && needs.ios-change-gate.outputs.native_planned == 'true' && needs.ios-change-gate.outputs.native_release_archive_required == 'true' && ( ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.base.ref == 'develop' || github.event.pull_request.base.ref == 'main')) || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/develop')) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) )
    runs-on:
      group: '${{ ((github.event_name == ''pull_request'' || github.event_name == ''merge_group'') || (github.event_name == ''workflow_dispatch'' && inputs.mac_runner == ''mitchell-reserved'') || (github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''promotion-evidence'')) && ''example-reviewed-pr-macs'' || ''example-team-macs'' }}'
      labels: '${{ fromJson((github.event_name == ''workflow_dispatch'' && inputs.mac_runner == ''mitchell-reserved'') && ''["self-hosted","macOS","ios-reserved-mitchell"]'' || ''["self-hosted","macOS","ios-xcode"]'') }}'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    concurrency:
      group: 'ios-${{ fromJSON((github.event_name == ''pull_request'' && toJSON(format(''pr-{0}'', github.event.pull_request.number))) || (github.event_name == ''merge_group'' && toJSON(format(''mq-{0}'', github.event.merge_group.head_ref))) || (github.event_name == ''workflow_dispatch'' && toJSON(format(''event-{0}'', github.run_id))) || toJSON(format(''event-{0}'', github.run_id))) }}-release-archive'
      cancel-in-progress: '${{ github.event_name == ''pull_request'' && github.event.action == ''synchronize'' }}'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout exact Release archive revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 64
          filter: 'blob:none'
          persist-credentials: false
          ref: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
      - name: Setup Node for the typed Release archive steps
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - name: Checkout typed iOS revision guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ needs.ios-change-gate.outputs.verifier_sha || env.EXAMPLE_CI_TRUSTED_BASE_SHA }}'
          path: .ci/trusted-ios-revision-guard
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            ci
      - name: Verify exact Release archive revision
        env:
          GH_TOKEN: '${{ github.token }}'
          EXACT_HEAD_SHA: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
          EXAMPLE_CI_PR_NUMBER: '${{ needs.ios-change-gate.outputs.pr_number }}'
          EXAMPLE_CI_EXACT_HEAD_SHA: '${{ needs.ios-change-gate.outputs.expected_head_sha }}'
          EXAMPLE_CI_TRUSTED_BASE_SHA: '${{ needs.ios-change-gate.outputs.expected_base_sha }}'
          EXAMPLE_CI_GUARD_SHA: '${{ needs.ios-change-gate.outputs.verifier_sha }}'
          EXAMPLE_CI_TRUSTED_BASE_REF: '${{ needs.ios-change-gate.outputs.expected_base_ref }}'
        run: node ../.ci/trusted-ios-revision-guard/ci/src/actions/ios/verifyExactReleaseArchiveRevision.ts
      - name: Select exact Xcode for Release archive
        run: node ../ci/src/actions/ios/selectXcode.ts 27.0@27A266a
      - name: Verify Release archive image prerequisites
        run: python3 ../scripts/ios-ci-image-prerequisites.py --purpose archive
      - name: Reclaim stale Release archive runner artifacts
        if: runner.environment == 'self-hosted'
        env:
          EXAMPLE_ACTIONS_READ_TOKEN: '${{ github.token }}'
          IOS_RUNNER_MIN_FREE_KB: '${{ needs.ios-change-gate.outputs.ios_macos_minimum_free_kb }}'
          IOS_RUNNER_COMPACT_DURABLE_EVIDENCE: '1'
          IOS_RUNNER_PRUNE_MERGED_PR_EVIDENCE: '1'
          IOS_RUNNER_PRUNE_SUPERSEDED_EVIDENCE: '1'
          IOS_RUNNER_RECLAIM_RUNNER_DIAGNOSTICS: '1'
          IOS_RUNNER_RECLAIM_CI_SIMULATORS: '1'
          IOS_RUNNER_PRIMARY_RUNTIME_IDENTIFIER: com.apple.CoreSimulator.SimRuntime.iOS-27-0
          IOS_RUNNER_RECLAIM_XCTEST_DEVICES: '1'
        run: bash ../scripts/reclaim-ios-runner-disk.sh preflight
      - name: Prepare Release archive build cache
        env:
          IOS_CI_CACHE_LANE: release-archive
          IOS_CI_PACKAGE_RESOLVED: '${{ github.workspace }}/ios/example-ios.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
        run: bash ../scripts/manage-ios-build-cache.sh prepare "$IOS_CI_CACHE_LANE"
      - name: Compile unsigned Release archive
        id: compile-release-archive
        env:
          EXPECTED_HEAD_SHA: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
        run: bash ../scripts/verify-ios-release-archive.sh
      - name: Upload Release archive diagnostics
        id: upload-release-archive-diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.compile-release-archive.outcome == 'failure'
        continue-on-error: true
        with:
          name: 'ios-release-archive-results-${{ github.run_id }}-${{ github.run_attempt }}'
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: '${{ env.IOS_RELEASE_ARCHIVE_XCODEBUILD_LOG }}'
      - name: Retain Release archive diagnostics on runner
        if: always() && steps.upload-release-archive-diagnostics.outcome == 'failure'
        run: node ../ci/src/actions/ios/retainReleaseArchiveDiagnostics.ts
      - name: Bound persistent Release archive build cache
        if: '${{ always() && env.IOS_CI_BUILD_CACHE_ENTRY != '''' }}'
        env:
          IOS_CI_CACHE_LANE: release-archive
        run: bash ../scripts/manage-ios-build-cache.sh prune "$IOS_CI_CACHE_LANE"
      - name: Remove current Release archive runner artifacts
        if: always()
        run: bash ../scripts/reclaim-ios-runner-disk.sh current
  build-ios-native-test-products:
    name: Build shared native iOS test products
    needs:
      - ios-change-gate
      - confirm-current-ios-pr
    if: always() && !cancelled() && needs.confirm-current-ios-pr.outputs.current == 'true' && needs.ios-change-gate.outputs.native_planned == 'true' && needs.ios-change-gate.outputs.native_should_run == 'true' && ( ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.base.ref == 'develop' || github.event.pull_request.base.ref == 'main')) || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/develop')) || (github.event_name == 'workflow_dispatch' && ((github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') || ((inputs.test_scope == 'financial-independence-evidence' || inputs.test_scope == 'shared-cta-evidence') && inputs.pull_request_number != ''))) )
    runs-on:
      group: '${{ (( github.event_name == ''workflow_dispatch'' && inputs.mac_runner == ''mitchell-reserved'' ) || (github.event_name == ''pull_request'' || github.event_name == ''merge_group'') || inputs.test_scope == ''financial-independence-evidence'' || inputs.test_scope == ''shared-cta-evidence'' || (github.event_name == ''workflow_dispatch'' && inputs.test_scope == ''promotion-evidence'')) && ''example-reviewed-pr-macs'' || ''example-team-macs'' }}'
      labels: '${{ fromJson((github.event_name == ''workflow_dispatch'' && inputs.mac_runner == ''mitchell-reserved'') && ''["self-hosted","macOS","ios-reserved-mitchell"]'' || ''["self-hosted","macOS","ios-xcode"]'') }}'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    concurrency:
      group: 'ios-${{ fromJSON((github.event_name == ''pull_request'' && toJSON(format(''pr-{0}'', github.event.pull_request.number))) || (github.event_name == ''merge_group'' && toJSON(format(''mq-{0}'', github.event.merge_group.head_ref))) || (github.event_name == ''workflow_dispatch'' && toJSON(format(''event-{0}'', github.run_id))) || toJSON(format(''event-{0}'', github.run_id))) }}-native-products'
      cancel-in-progress: '${{ github.event_name == ''pull_request'' && github.event.action == ''synchronize'' }}'
    defaults:
