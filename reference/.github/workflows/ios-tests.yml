          IOS_3998_CLEANUP_RECEIPT: '${{ env.IOS_3998_CLEANUP_RECEIPT }}'
          BUDGET_E2E_XCODEBUILD_LOG: '${{ env.BUDGET_E2E_XCODEBUILD_LOG }}'
          BUDGET_E2E_RESULT_BUNDLE: '${{ env.BUDGET_E2E_RESULT_BUNDLE }}'
        run: node ci/src/actions/ios/retainIosE2eEvidence.ts
      - name: Retain Issue 3999 Release archive evidence
        if: env.E2E_LANE == 'budget' && always() && !cancelled() && inputs.test_scope == 'debt-card-evidence' && steps.debt-card-release-archive.outcome == 'success'
        env:
