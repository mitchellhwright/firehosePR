name: Track Xcode Cloud builds
on:
  push:
    branches:
      - main
  schedule:
    - cron: 37 * * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: xcode-cloud-build-tags
  cancel-in-progress: false
env:
  npm_config_cache: '${RUNNER_TOOL_CACHE}/npm-cache'
jobs:
  reconcile:
    name: Tag successful Xcode Cloud main builds
    if: 'github.event_name != ''workflow_dispatch'' || github.ref == ''refs/heads/main'' || github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch)'
    runs-on:
      - self-hosted
      - Linux
      - example-trusted-control
    steps:
      - name: Checkout the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ github.event.repository.default_branch }}'
          persist-credentials: false
      - name: Set up Node for typed maintenance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - name: Validate App Store Connect configuration
        env:
          APP_STORE_CONNECT_API_KEY_ID: '${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}'
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: '${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}'
          APP_STORE_CONNECT_API_KEY_CONTENT: '${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}'
        run: node ci/src/actions/validateAppStoreConnectConfiguration.ts
      - name: Create GitHub App token for Xcode Cloud tags
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: '${{ secrets.PROMOTION_CHECKPOINT_APP_ID }}'
          private-key: '${{ secrets.PROMOTION_CHECKPOINT_APP_PRIVATE_KEY }}'
          permission-contents: write
          permission-workflows: write
          owner: '${{ github.repository_owner }}'
          repositories: '${{ github.event.repository.name }}'
      - name: Reconcile Xcode Cloud build tags
        env:
          APP_STORE_CONNECT_API_KEY_ID: '${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}'
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: '${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}'
          APP_STORE_CONNECT_API_KEY_CONTENT: '${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}'
          APP_STORE_CONNECT_APP_ID: '1234567890'
          GH_TOKEN: '${{ steps.app-token.outputs.token }}'
          REPOSITORY: '${{ github.repository }}'
        run: node ci/src/actions/reconcileXcodeCloudBuildTags.ts
