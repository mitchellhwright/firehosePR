        with:
          entry: ci/src/actions/verifyWellnessDatabases.ts
      - name: Apply Drizzle migrations
        run: 'npm run db:migrate'
      - name: Verify Plaid scheduler schema
        run: 'npm run db:verify-plaid-scheduler'
      - name: Prove Plaid scheduler verifier rejects schema drift
        run: node ci/src/actions/provePlaidSchedulerSchemaDrift.ts
      - name: Test distributed database state
        uses: ./.github/actions/typed-step-runner
        env:
          EXAMPLE_STEP_NAME: Test distributed database state
          EXAMPLE_STEP_OWNER: product
          EXAMPLE_STEP_NEXT_ACTION: a skipped or empty suite is the failure; read which file collected no tests
        with:
          entry: ci/src/actions/testDistributedDatabaseState.ts
      - name: Prepare conversation runtime SQL database
        uses: ./.github/actions/typed-step-runner
        env:
          EXAMPLE_STEP_NAME: Prepare conversation runtime SQL database
          EXAMPLE_STEP_OWNER: infrastructure
          EXAMPLE_STEP_NEXT_ACTION: read the psql error; a create failure means the container is no longer healthy
        with:
          entry: ci/src/actions/prepareConversationRuntimeDatabases.ts
      - name: Run selected database acceptance tests
        if: 'needs.plan-pr-validation.outputs.targeted_integration_tests != ''[]'' || needs.plan-pr-validation.outputs.entitlement_acceptance_required == ''true'''
        env:
          TARGETED_SERVER_TESTS_JSON: '${{ needs.plan-pr-validation.outputs.targeted_integration_tests }}'
          TARGETED_TEST_RESULTS_FILE: '${{ runner.temp }}/targeted-integration-results.json'
          ENTITLEMENT_ACCEPTANCE_REQUIRED: '${{ needs.plan-pr-validation.outputs.entitlement_acceptance_required }}'
          ENTITLEMENT_TEST_DATABASE_URL: '${{ env.DATABASE_URL }}'
          PLAID_SYNC_ATTEMPT_TEST_DATABASE_URL: '${{ env.DATABASE_URL }}'
          STAGING_QA_FIXTURE_TEST_DATABASE_URL: '${{ env.DATABASE_URL }}'
          AUTH_CODE_TEST_DATABASE_URL: '${{ env.DATABASE_URL }}'
          APPLE_AUTH_TEST_DATABASE_URL: '${{ env.DATABASE_URL }}'
          NOTIFICATION_TEST_DATABASE_URL: '${{ env.DATABASE_URL }}'
          RUNTIME_POSTGRES_TEST_URL: '${{ env.RUNTIME_POSTGRES_TEST_URL }}'
          VEHICLE_LINK_TEST_DATABASE_URL: '${{ env.DATABASE_URL }}'
          REQUIRE_VEHICLE_LINK_POSTGRES_TESTS: '1'
          MORTGAGE_PLAN_TEST_DATABASE_URL: '${{ env.DATABASE_URL }}'
          REQUIRE_MORTGAGE_PLAN_POSTGRES_TESTS: '1'
          RUN_INTEGRATION_TESTS: '1'
        run: node ci/src/actions/runDatabaseIntegrationValidation.ts
      - name: Remove PostgreSQL container
        uses: ./.github/actions/typed-step-runner
        if: always() && env.DB_CONTAINER_NAME != ''
        env:
          EXAMPLE_STEP_NAME: Remove PostgreSQL container
          EXAMPLE_STEP_OWNER: infrastructure
          EXAMPLE_STEP_NEXT_ACTION: a leftover container is the failure; remove it on the runner before the next run
        with:
          entry: ci/src/actions/removePostgresqlContainer.ts
