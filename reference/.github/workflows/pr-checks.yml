        env:
          RECEIPT_DIRECTORY: '${{ runner.temp }}/linux-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}'
          PR_NUMBER: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.number)) || (github.event_name == ''merge_group'' && toJSON('''')) || (github.event_name == ''workflow_dispatch'' && toJSON('''')) || toJSON(''ci-event-field-unavailable'')) }}'
          PR_BASE_SHA: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.base.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.base_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
          PR_HEAD_SHA: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.sha)) || (github.event_name == ''merge_group'' && toJSON(github.event.merge_group.head_sha || ''ci-event-field-unavailable'')) || (github.event_name == ''workflow_dispatch'' && toJSON(github.sha)) || toJSON(''ci-event-field-unavailable'')) }}'
          PR_HEAD_REPOSITORY: '${{ fromJSON((github.event_name == ''pull_request'' && toJSON(github.event.pull_request.head.repo.full_name)) || (github.event_name == ''merge_group'' && toJSON(github.repository)) || (github.event_name == ''workflow_dispatch'' && toJSON('''')) || toJSON(''ci-event-field-unavailable'')) }}'
          SHARD: '${{ matrix.shard }}'
