          RECEIPT_RUNNER_ENVIRONMENT: '${{ runner.environment }}'
          RECEIPT_PHASE: complete
          SHARD_OUTCOME: '${{ steps.native-shard.outcome }}'
        continue-on-error: true
        run: node ci/src/actions/recordLinuxShardReceipt.ts
