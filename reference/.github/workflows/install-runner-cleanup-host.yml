        description: Verify the active hook without changing the listener
        required: true
        type: boolean
      correlation_id:
        description: Opaque token the dispatching fleet run uses to find this run
        required: false
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: 'install-runner-cleanup-hook-${{ inputs.host_label }}'
  cancel-in-progress: false
env:
  npm_config_cache: '${RUNNER_TOOL_CACHE}/npm-cache'
jobs:
  install:
    name: 'Install runner cleanup hook (${{ inputs.host_label }})'
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - '${{ inputs.host_label }}'
    timeout-minutes: 10
    outputs:
      activation_required: '${{ steps.installer.outputs.activation_required }}'
    steps:
      - name: Check out trusted cleanup source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node for typed maintenance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - name: Create bounded runner activation handoff token
        id: activation-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
