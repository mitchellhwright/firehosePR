name: Install runner cleanup hook host
run-name: 'Runner maintenance - ${{ inputs.host_label }}${{ inputs.correlation_id && format('' ({0})'', inputs.correlation_id) || '''' }}'
on:
  workflow_dispatch:
    inputs:
      host_label:
        description: Durable physical runner host label
        required: true
        type: string
      platform:
        description: Host operating system
        required: true
        type: choice
        options:
          - macos
          - linux
