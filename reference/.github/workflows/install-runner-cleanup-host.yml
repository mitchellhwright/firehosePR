          EXAMPLE_STEP_OWNER: infrastructure
          EXAMPLE_STEP_NEXT_ACTION: read the activation log named in the error; the listener is left online if activation cannot start
          ACTIVATION_CONTEXT: 'runner-environment/${{ inputs.host_label }}/${{ github.run_id }}/${{ github.run_attempt }}'
          EXPECTED_PLATFORM: '${{ inputs.platform }}'
          GITHUB_TOKEN_VALUE: '${{ steps.activation-token.outputs.token }}'
