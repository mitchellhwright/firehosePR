name: PR terminal cleanup
on:
  pull_request_target:
    types:
      - closed
      - converted_to_draft
permissions:
  actions: write
  contents: read
  pull-requests: read
env:
  npm_config_cache: '${RUNNER_TOOL_CACHE}/npm-cache'
jobs:
  cancel-blocked-pr-ci:
    name: Cancel abandoned PR work
    runs-on:
      - self-hosted
      - Linux
      - example-trusted-control
    timeout-minutes: 10
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ github.event.repository.default_branch }}'
          persist-credentials: false
          sparse-checkout: |
            ci/src
      - name: Set up Node for typed maintenance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - name: Cancel abandoned pull-request validation
        env:
          CI_WORKFLOW_NAMES: 'PR Checks,Test - iOS'
          GITHUB_TOKEN: '${{ github.token }}'
        run: node ci/src/actions/cancelTerminalPrRuns.ts
